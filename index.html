<style>

  .flip-card.is-flipped { transform: rotateY(180deg); }
  .flip-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }

  /* Thông báo Toast */
  #toastRoot { position: fixed; z-index: 70; top: 12px; left: 12px; right: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  @media (min-width: 768px) { #toastRoot { left: auto; top: 18px; right: 20px; align-items: flex-end; } }
  .toast { pointer-events: auto; opacity: 0; transform: translateY(-8px) scale(.98); transition: opacity .22s ease, transform .22s ease; }
  .toast.toast-in { opacity: 1; transform: none; }

  /* Modal */
  .modal-fade { animation: fadeIn .18s ease; }
  .modal-pop { animation: popIn .22s cubic-bezier(.2,.8,.2,1); }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes popIn { from { opacity: 0; transform: translateY(16px) scale(.98) } to { opacity: 1; transform: none } }
  @keyframes shake { 0%,100% { transform: translateX(0) } 20%,60% { transform: translateX(-6px) } 40%,80% { transform: translateX(6px) } }
  .shake { animation: shake .4s ease; }
  @keyframes savedPulse { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,.45) } 100% { box-shadow: 0 0 0 8px rgba(16,185,129,0) } }

  .view-enter { animation: viewIn .25s ease; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

  .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 0px); }
  .bottom-nav { padding-bottom: env(safe-area-inset-bottom); }
  .main-pad { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

<script>
'use strict';
/* =====================================================================
   1. HẰNG SỐ & CẤU HÌNH
   ===================================================================== */
const APP_KEY = 'vocab_app_db_v1';
const STORAGE_KEYS = ['vocab_items', 'study_stats', 'active_session', 'app_settings', 'tombstones', 'form_draft', 'bulk_draft'];
const DAY = 86400000;
const SYNC_FILE = 'vocabnest-sync.json';

const LEVELS = [
  { id: 0, name: 'Mới thêm', bar: 'bg-slate-400', badge: 'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300', dot: 'bg-slate-400' },
  { id: 1, name: 'Đang học', bar: 'bg-rose-400', badge: 'bg-rose-50 text-rose-600 dark:bg-rose-500/15 dark:text-rose-300', dot: 'bg-rose-400' },
  { id: 2, name: 'Quen thuộc', bar: 'bg-amber-400', badge: 'bg-amber-50 text-amber-700 dark:bg-amber-500/15 dark:text-amber-300', dot: 'bg-amber-400' },
  { id: 3, name: 'Nắm vững', bar: 'bg-sky-500', badge: 'bg-sky-50 text-sky-700 dark:bg-sky-500/15 dark:text-sky-300', dot: 'bg-sky-500' },
  { id: 4, name: 'Đã thuộc lòng', bar: 'bg-emerald-500', badge: 'bg-emerald-50 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300', dot: 'bg-emerald-500' }
];

const POS = [
  { id: 'n', short: 'n', label: 'Danh từ' },
  { id: 'v', short: 'v', label: 'Động từ' },
  { id: 'adj', short: 'adj', label: 'Tính từ' },
  { id: 'adv', short: 'adv', label: 'Trạng từ' },
  { id: 'phrase', short: 'phr', label: 'Cụm từ' },
  { id: 'idiom', short: 'idm', label: 'Thành ngữ' }
];

const MEMORY = [
  { id: 'mnemonic', icon: '🧠', label: 'Mẹo nhớ liên tưởng', hint: 'Mnemonic / Âm thanh tương tự', placeholder: 'VD: Abandon (bỏ rơi) → "Ơ kìa bạn đừng bỏ rơi tôi"' },
  { id: 'collocations', icon: '🔗', label: 'Cụm từ đi kèm & Gia đình từ', hint: 'Collocations / Word family / Synonyms & Antonyms', placeholder: 'VD: abandon a plan, abandon hope · abandonment (n) · syn: desert, give up · ant: keep' },
  { id: 'personal', icon: '✍️', label: 'Câu tự đặt cá nhân', hint: 'Personal context / Active recall', placeholder: 'Một câu gắn liền với kỷ niệm hoặc cuộc sống thật của bạn...' },
  { id: 'roots', icon: '🌱', label: 'Phân tích gốc từ', hint: 'Root / Prefix / Suffix', placeholder: 'VD: re- (lại) + salire (nhảy) → bật trở lại → kiên cường' }
];

const TEST_TYPES = [
  { id: 'mc', icon: '🔘', label: 'Trắc nghiệm', desc: 'Từ ↔ Nghĩa, 4 đáp án' },
  { id: 'cloze', icon: '🧩', label: 'Điền từ vào câu', desc: 'Đục lỗ từ trong câu ví dụ' },
  { id: 'dictation', icon: '🎧', label: 'Nghe & gõ chính tả', desc: 'Nghe phát âm, gõ lại từ' },
  { id: 'sentence', icon: '✍️', label: 'Thử thách đặt câu', desc: 'Tự đặt câu chứa từ' }
];
const TYPE_LABEL = { mc: 'Trắc nghiệm', cloze: 'Điền từ vào câu', recall: 'Nghĩa → Gõ từ', dictation: 'Nghe & gõ chính tả', sentence: 'Thử thách đặt câu' };

const FALLBACK_WORDS = ['abundant', 'ambiguous', 'benevolent', 'candid', 'diligent', 'eloquent', 'fragile', 'genuine', 'hesitate', 'inevitable', 'negotiate', 'obsolete', 'persevere', 'reluctant', 'spontaneous', 'tedious', 'versatile', 'vivid', 'wholesome', 'gratitude'];
const FALLBACK_MEANINGS = ['dồi dào, phong phú', 'mơ hồ, không rõ ràng', 'nhân từ, rộng lượng', 'thẳng thắn, bộc trực', 'siêng năng, cần cù', 'hùng hồn, có tài ăn nói', 'mong manh, dễ vỡ', 'chân thật, xác thực', 'do dự, ngập ngừng', 'không thể tránh khỏi', 'đàm phán, thương lượng', 'lỗi thời, cũ kỹ', 'kiên trì, bền bỉ', 'miễn cưỡng, không sẵn lòng', 'tự phát, ngẫu hứng', 'tẻ nhạt, chán ngắt', 'linh hoạt, đa năng', 'sống động, rõ nét', 'lành mạnh, bổ ích', 'lòng biết ơn'];

const DEFAULT_SETTINGS = {
  theme: null,
  voice: 'en-US',
  rate: 0.95,
  dailyGoal: 15,
  autoSpeak: false,
  wordsSinceBackup: 0,
  nextBackupPrompt: 20,
  lastBackupAt: null,
  cloud: { provider: 'none', gistToken: '', gistId: '', firebaseUrl: '', firebaseAuth: '', autoSync: true, lastSyncAt: null }
};
const DEFAULT_STATS = {
  streak: 0,
  lastStudyDate: null,
  dailyHistory: {},
  todayWords: { date: null, ids: [] },
  testResults: [],
  totalReviews: 0,
  goalCelebrated: null
};
const DEFAULT_SESSION = {
  view: 'dashboard',
  addTab: 'single',
  library: { q: '', tag: '', level: '', sort: 'newest', mode: 'card' },
  studyConfig: { filter: 'due', tag: '', shuffle: true, limit: 20 },
  flashcard: null,
  testConfig: { count: 10, scope: 'due', tag: '', types: ['mc', 'cloze', 'dictation', 'sentence'] },
  test: null
};

/* =====================================================================
   2. TIỆN ÍCH CHUNG
   ===================================================================== */
const lucide = { createIcons() { try { if (window.lucide && window.lucide.createIcons) window.lucide.createIcons(); } catch (e) { /* bỏ qua */ } } };
const ic = (name, cls = 'w-4 h-4') => `<i data-lucide="${name}" class="${cls}"></i>`;

const U = {
  uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); },
  esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  norm(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); },
  key(s) { return U.norm(s).toLowerCase(); },
  pad(n) { return String(n).padStart(2, '0'); },
  dateKey(d = new Date()) { const x = new Date(d); return `${x.getFullYear()}-${U.pad(x.getMonth() + 1)}-${U.pad(x.getDate())}`; },
  endOfToday() { const d = new Date(); d.setHours(23, 59, 59, 999); return d.getTime(); },
  startOfDay(ts = Date.now()) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); },
  time(ts = Date.now()) { const d = new Date(ts); return `${U.pad(d.getHours())}:${U.pad(d.getMinutes())}:${U.pad(d.getSeconds())}`; },
  shortTime(ts = Date.now()) { const d = new Date(ts); return `${U.pad(d.getHours())}:${U.pad(d.getMinutes())}`; },
  date(ts) { const d = new Date(ts); return `${U.pad(d.getDate())}/${U.pad(d.getMonth() + 1)}/${d.getFullYear()}`; },
  dateTime(ts) { return `${U.shortTime(ts)} · ${U.date(ts)}`; },
  relDue(ts) {
    if (!ts) return 'Chưa lên lịch';
    const diff = Math.round((U.startOfDay(ts) - U.startOfDay()) / DAY);
    if (diff < 0) return `Quá hạn ${-diff} ngày`;
    if (diff === 0) return 'Ôn hôm nay';
    if (diff === 1) return 'Ôn ngày mai';
    return `Ôn sau ${diff} ngày`;
  },
  duration(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    const m = Math.floor(s / 60), r = s % 60;
    return m ? `${m} phút ${U.pad(r)} giây` : `${r} giây`;
  },
  clock(ms) { const s = Math.max(0, Math.floor(ms / 1000)); return `${U.pad(Math.floor(s / 60))}:${U.pad(s % 60)}`; },
  shuffle(a) { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; },
  debounce(fn, ms) {
    let t = null, lastArgs = null;
    const d = (...a) => { lastArgs = a; clearTimeout(t); t = setTimeout(() => { t = null; fn(...lastArgs); }, ms); };
    d.flush = () => { if (t) { clearTimeout(t); t = null; fn(...(lastArgs || [])); } };
    d.cancel = () => { clearTimeout(t); t = null; };
    return d;
  },
  reEsc(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); },
  bytes(n) { if (n < 1024) return `${n} B`; if (n < 1048576) return `${(n / 1024).toFixed(1)} KB`; return `${(n / 1048576).toFixed(2)} MB`; },
  clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); },
  isObj(o) { return o !== null && typeof o === 'object' && !Array.isArray(o); },
  deepMerge(def, val) {
    if (U.isObj(def) && U.isObj(val)) {
      const out = {};
      Object.keys(def).forEach(k => { out[k] = U.deepMerge(def[k], val[k]); });
      Object.keys(val).forEach(k => { if (!(k in def)) out[k] = val[k]; });
      return out;
    }
    return val === undefined ? U.clone(def) : val;
  },
  answerNorm(s) {
    return U.norm(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/^[\s"'.,!?;:()]+|[\s"'.,!?;:()]+$/g, '');
  },
  lev(a, b) {
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[b.length];
  },
  download(filename, content, mime = 'application/json') {
    const blob = new Blob([content], { type: mime + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  },
  async copyText(str) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(str);
        return true;
      } catch (e) { /* fallback bên dưới */ }
    }
    try {
      const ta = document.createElement('textarea');
      ta.value = str;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      ta.style.pointerEvents = 'none';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      console.warn('[copyText]', e);
      return false;
    }
  },
  greeting() {
    const h = new Date().getHours();
    if (h < 5) return 'Khuya rồi, học nhẹ nhàng thôi 🌙';
    if (h < 11) return 'Chào buổi sáng ☀️';
    if (h < 14) return 'Chào buổi trưa 🌤️';
    if (h < 18) return 'Chào buổi chiều 🌇';
    return 'Chào buổi tối 🌙';
  }
};

function normalizePos(s) {
  const k = U.key(s).replace(/[.()]/g, '');
  if (!k) return '';
  const map = {
    n: 'n', noun: 'n', 'danh từ': 'n', dt: 'n',
    v: 'v', verb: 'v', 'động từ': 'v', đt: 'v',
    adj: 'adj', a: 'adj', adjective: 'adj', 'tính từ': 'adj', tt: 'adj',
    adv: 'adv', adverb: 'adv', 'trạng từ': 'adv',
    phrase: 'phrase', phr: 'phrase', 'cụm từ': 'phrase', 'phrasal verb': 'phrase', 'cụm động từ': 'phrase', collocation: 'phrase',
    idiom: 'idiom', idm: 'idiom', 'thành ngữ': 'idiom'
  };
  return map[k] || '';
}
function posInfo(id) { return POS.find(p => p.id === id) || null; }
function normalizeIpa(s) {
  const v = U.norm(s);
  if (!v) return '';
  if (/^[\/\[]/.test(v)) return v;
  return `/${v}/`;
}

/* =====================================================================
   3. STORAGE MANAGER (localStorage + IndexedDB + persist())
   ===================================================================== */
const StorageManager = {
  db: null,
  idbOk: false,
  lsOk: true,
  persisted: false,
  lastSavedAt: null,
  listeners: [],

  lsKey(k) { return `${APP_KEY}:${k}`; },

  openIDB() {
    return new Promise(resolve => {
      if (!('indexedDB' in window)) return resolve(null);
      let settled = false;
      const done = v => { if (!settled) { settled = true; resolve(v); } };
      setTimeout(() => done(null), 2500);
      try {
        const req = indexedDB.open(APP_KEY, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        };
        req.onsuccess = () => { this.db = req.result; this.idbOk = true; done(this.db); };
        req.onerror = () => done(null);
        req.onblocked = () => done(null);
      } catch (e) { done(null); }
    });
  },
  idbGet(k) {
    return new Promise(resolve => {
      if (!this.db) return resolve(null);
      try {
        const r = this.db.transaction('kv', 'readonly').objectStore('kv').get(k);
        r.onsuccess = () => resolve(r.result == null ? null : r.result);
        r.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
  },
  idbPut(k, v) {
    return new Promise(resolve => {
      if (!this.db) return resolve(false);
      try {
        const tx = this.db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(v, k);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
        tx.onabort = () => resolve(false);
      } catch (e) { resolve(false); }
    });
  },
  idbDel(k) {
    return new Promise(resolve => {
      if (!this.db) return resolve(false);
      try {
        const tx = this.db.transaction('kv', 'readwrite');
        tx.objectStore('kv').delete(k);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      } catch (e) { resolve(false); }
    });
  },
  lsGet(k) {
    try {
      const raw = localStorage.getItem(this.lsKey(k));
      if (!raw) return null;
      const p = JSON.parse(raw);
      if (U.isObj(p) && 'data' in p && 'savedAt' in p) return p;
      return { v: 1, savedAt: 0, data: p };
    } catch (e) {
      console.warn('[StorageManager] Lỗi đọc localStorage', k, e);
      return null;
    }
  },
  lsSet(k, wrapper) {
    try {
      localStorage.setItem(this.lsKey(k), JSON.stringify(wrapper));
      this.lsOk = true;
      return true;
    } catch (e) {
      this.lsOk = false;
      console.warn('[StorageManager] Lỗi ghi localStorage (có thể đầy bộ nhớ) — dữ liệu vẫn được ghi vào IndexedDB', k, e);
      return false;
    }
  },
  async init() {
    await this.openIDB();
    const out = {};
    for (const k of STORAGE_KEYS) {
      const a = this.lsGet(k);
      const b = await this.idbGet(k);
      let pick = null;
      if (a && b) pick = (b.savedAt || 0) > (a.savedAt || 0) ? b : a;
      else pick = a || b;
      out[k] = pick ? pick.data : null;
      if (pick && pick === b && (!a || (b.savedAt || 0) > (a.savedAt || 0))) this.lsSet(k, b);
      if (pick && pick === a && (!b || (a.savedAt || 0) > (b.savedAt || 0))) this.idbPut(k, a);
      if (pick && pick.savedAt && k !== 'form_draft' && k !== 'bulk_draft') this.lastSavedAt = Math.max(this.lastSavedAt || 0, pick.savedAt);
    }
    this.requestPersist();
    return out;
  },
  async requestPersist() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        this.persisted = await navigator.storage.persisted();
        if (!this.persisted) this.persisted = await navigator.storage.persist();
      }
    } catch (e) { this.persisted = false; }
    return this.persisted;
  },
  save(k, data, opts = {}) {
    const wrapper = { v: 1, savedAt: Date.now(), data };
    const ok = this.lsSet(k, wrapper);
    this.idbPut(k, wrapper);
    if (k !== 'form_draft' && k !== 'bulk_draft') {
      this.lastSavedAt = wrapper.savedAt;
      if (!opts.silent) this.listeners.forEach(fn => { try { fn(k, ok || this.idbOk); } catch (e) { console.error(e); } });
    }
    return ok || this.idbOk;
  },
  remove(k) {
    try { localStorage.removeItem(this.lsKey(k)); } catch (e) { /* bỏ qua */ }
    this.idbDel(k);
  },
  sizeOf(k) {
    try { return (localStorage.getItem(this.lsKey(k)) || '').length * 2; } catch (e) { return 0; }
  },
  totalSize() { return STORAGE_KEYS.reduce((s, k) => s + this.sizeOf(k), 0); },
  async estimate() {
    try {
      if (navigator.storage && navigator.storage.estimate) return await navigator.storage.estimate();
    } catch (e) { /* bỏ qua */ }
    return null;
  }
};

   4. TRẠNG THÁI ỨNG DỤNG & KHO DỮ LIỆU

const S = {
  items: [],
  stats: U.clone(DEFAULT_STATS),
  session: U.clone(DEFAULT_SESSION),
  settings: U.clone(DEFAULT_SETTINGS),
  tombstones: {},
  draft: null,
  bulkDraft: ''
};
const ActiveForms = new Set();

function sanitizeItem(r) {
  r = r || {};
  const now = Date.now();
  let ex = [];
  if (Array.isArray(r.examples)) ex = r.examples;
  else if (r.example) ex = [{ en: r.example, vi: r.exampleVi || r.example_vi || '' }];
  const mem = U.isObj(r.memory) ? r.memory : {};
  const num = (v, d = 0) => (Number.isFinite(Number(v)) ? Number(v) : d);
  const tagsRaw = Array.isArray(r.tags) ? r.tags : (typeof r.tags === 'string' ? r.tags.split(/[,;]/) : []);
  return {
    id: r.id ? String(r.id) : U.uid(),
    word: U.norm(r.word),
    meaning: String(r.meaning == null ? '' : r.meaning).trim(),
    pos: POS.some(p => p.id === r.pos) ? r.pos : normalizePos(r.pos),
    ipa: U.norm(r.ipa),
    tags: [...new Set(tagsRaw.map(t => U.norm(t)).filter(Boolean))],
    examples: ex.map(e => (typeof e === 'string' ? { en: U.norm(e), vi: '' } : { en: U.norm(e && e.en), vi: U.norm(e && e.vi) })).filter(e => e.en),
    memory: {
      mnemonic: String(mem.mnemonic || r.mnemonic || '').trim(),
      collocations: String(mem.collocations || r.collocations || '').trim(),
      personal: String(mem.personal || r.personal || '').trim(),
      roots: String(mem.roots || r.roots || '').trim()
    },
    level: Math.min(4, Math.max(0, Math.round(num(r.level, 0)))),
    correct: Math.max(0, num(r.correct, 0)),
    wrong: Math.max(0, num(r.wrong, 0)),
    lastReviewed: r.lastReviewed ? num(r.lastReviewed, null) : null,
    nextReview: r.nextReview ? num(r.nextReview, now) : (r.createdAt ? num(r.createdAt, now) : now),
    createdAt: num(r.createdAt, now),
    updatedAt: num(r.updatedAt, num(r.createdAt, now)),
    isSample: !!r.isSample,
    history: Array.isArray(r.history) ? r.history.slice(-30) : []
  };
}

const Store = {
  saveItems() { StorageManager.save('vocab_items', S.items); if (!Cloud.suppress) scheduleCloudPush(); },
  saveStats() { StorageManager.save('study_stats', S.stats); if (!Cloud.suppress) scheduleCloudPush(); },
  saveSession() { StorageManager.save('active_session', S.session); },
  saveSettings() { StorageManager.save('app_settings', S.settings); },
  saveTomb() { StorageManager.save('tombstones', S.tombstones); },
  flushAll() {
    try {

      ActiveForms.forEach(f => { try { f.flush(); } catch (e) { /* bỏ qua */ } });
      try { scheduleCloudPush.flush(); } catch (e) {}
      StorageManager.save('vocab_items', S.items, { silent: true });
      StorageManager.save('study_stats', S.stats, { silent: true });
      StorageManager.save('active_session', S.session, { silent: true });
      StorageManager.save('app_settings', S.settings, { silent: true });
      StorageManager.save('tombstones', S.tombstones, { silent: true });
    } catch (e) { console.error('[flushAll]', e); }
  },
  get(id) { return S.items.find(i => i.id === id) || null; },
  findByWord(w, excludeId) {
    const k = U.key(w);
    if (!k) return null;
    return S.items.find(i => U.key(i.word) === k && i.id !== excludeId) || null;
  },
  tags() {
    const m = new Map();
    S.items.forEach(i => i.tags.forEach(t => m.set(t, (m.get(t) || 0) + 1)));
    return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([tag, count]) => ({ tag, count }));
  },
  build(data) {
    const now = Date.now();
    return sanitizeItem(Object.assign({}, data, { id: U.uid(), createdAt: now, updatedAt: now, level: 0, correct: 0, wrong: 0, lastReviewed: null, nextReview: now, history: [] }));
  },
  add(data) {
    const item = this.build(data);
    S.items.unshift(item);
    S.settings.wordsSinceBackup = (S.settings.wordsSinceBackup || 0) + 1;
    delete S.tombstones[item.id];
    this.saveItems();
    this.saveSettings();
    return item;
  },
  addMany(list) {
    const items = list.map(d => this.build(d));
    items.forEach((it, i) => { it.createdAt += i; it.updatedAt = it.createdAt; });
    S.items = [...items.reverse(), ...S.items];
    S.settings.wordsSinceBackup = (S.settings.wordsSinceBackup || 0) + items.length;
    this.saveItems();
    this.saveSettings();
    return items;
  },
  update(id, data) {
    const it = this.get(id);
    if (!it) return null;
    const clean = sanitizeItem(Object.assign({}, it, data));
    Object.assign(it, {
      word: clean.word, meaning: clean.meaning, pos: clean.pos, ipa: clean.ipa, tags: clean.tags,
      examples: clean.examples, memory: clean.memory, updatedAt: Date.now()
    });
    this.saveItems();
    return it;
  },
  mergeInto(target, d) {
    const hasMeaning = U.key(target.meaning).includes(U.key(d.meaning));
    if (d.meaning && !hasMeaning) target.meaning = `${target.meaning}; ${d.meaning}`;
    if (!target.pos && d.pos) target.pos = d.pos;
    if (!target.ipa && d.ipa) target.ipa = d.ipa;
    target.tags = [...new Set([...target.tags, ...(d.tags || [])])];
    (d.examples || []).forEach(e => { if (e.en && !target.examples.some(x => U.key(x.en) === U.key(e.en))) target.examples.push({ en: e.en, vi: e.vi || '' }); });
    MEMORY.forEach(m => {
      const add = d.memory && d.memory[m.id] ? d.memory[m.id].trim() : '';
      if (add && !target.memory[m.id].includes(add)) target.memory[m.id] = target.memory[m.id] ? `${target.memory[m.id]}\n${add}` : add;
    });
    target.updatedAt = Date.now();
    return target;
  },
  remove(id) {
    S.items = S.items.filter(i => i.id !== id);
    S.tombstones[id] = Date.now();
    this.saveItems();
    this.saveTomb();
  },
  due() {
    const end = U.endOfToday();
    return S.items.filter(i => (i.nextReview || 0) <= end);
  },
  isHard(i) { return i.wrong > 0 && (i.wrong >= i.correct || i.wrong >= 3); }
};

/* =====================================================================
   5. THUẬT TOÁN ÔN TẬP NGẮT QUÃNG (SRS 5 CẤP ĐỘ)
   ===================================================================== */
const SRS = {
  intervals: [0, 1, 3, 7, 14],
  compute(item, grade) {
    const L = item.level || 0;
    if (grade === 1) return { level: L >= 2 ? 1 : L, days: 0 };
    if (grade === 2) return { level: Math.max(1, Math.min(L, 2)), days: 1 };
    if (grade === 3) { const nl = Math.min(4, Math.max(2, L + 1)); return { level: nl, days: nl >= 3 ? 5 : 3 }; }
    const nl = Math.min(4, Math.max(3, L + 2));
    return { level: nl, days: nl === 3 ? 7 : (L === 4 ? 30 : 14) };
  },
  label(days) { return days === 0 ? 'Học lại ngay' : `${days} ngày`; },
  push(item, entry) { item.history.push(entry); if (item.history.length > 30) item.history = item.history.slice(-30); },
  apply(item, grade) {
    const r = this.compute(item, grade);
    const now = Date.now();
    item.level = r.level;
    item.nextReview = r.days === 0 ? now : now + r.days * DAY;
    if (grade === 1) item.wrong++; else item.correct++;
    item.lastReviewed = now;
    item.updatedAt = now;
    this.push(item, { t: now, g: grade, s: 'card' });
  },
  applyTest(item, ok) {
    const now = Date.now();
    const L = item.level || 0;
    if (ok) {
      const nl = Math.min(4, L + 1);
      const days = nl === 4 && L === 4 ? 30 : Math.max(1, this.intervals[nl]);
      item.level = nl;
      item.nextReview = now + days * DAY;
      item.correct++;
    } else {
      item.level = Math.min(L, 1);
      item.nextReview = now;
      item.wrong++;
    }
    item.lastReviewed = now;
    item.updatedAt = now;
    this.push(item, { t: now, g: ok ? 3 : 1, s: 'test' });
  }
};

function computeStreak() {
  const h = S.stats.dailyHistory || {};
  const d = new Date();
  if (!h[U.dateKey(d)]) d.setDate(d.getDate() - 1);
  let n = 0;
  while (h[U.dateKey(d)] > 0) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function recordActivity(id) {
  const t = U.dateKey();
  const st = S.stats;
  if (!st.todayWords || st.todayWords.date !== t) st.todayWords = { date: t, ids: [] };
  if (!st.todayWords.ids.includes(id)) {
    st.todayWords.ids.push(id);
    st.dailyHistory[t] = (st.dailyHistory[t] || 0) + 1;
  }
  st.totalReviews = (st.totalReviews || 0) + 1;
  st.lastStudyDate = t;
  st.streak = computeStreak();
  if (st.dailyHistory[t] >= S.settings.dailyGoal && st.goalCelebrated !== t) {
    st.goalCelebrated = t;
    setTimeout(() => Toast.show(`🎉 Tuyệt vời! Bạn đã đạt mục tiêu ${S.settings.dailyGoal} từ hôm nay. Chuỗi 🔥 ${st.streak} ngày!`, 'success', 4500), 300);
  }
  Store.saveStats();
  renderNav();
}

/* =====================================================================
   6. PHÁT ÂM (Web Speech API)
   ===================================================================== */
const Speech = {
  voices: [],
  supported: typeof window !== 'undefined' && 'speechSynthesis' in window,
  init() {
    if (!this.supported) return;
    const load = () => { this.voices = window.speechSynthesis.getVoices() || []; };
    load();
    try { window.speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { window.speechSynthesis.onvoiceschanged = load; }
  },
  pick(lang) {
    const v = this.voices;
    const norm = x => (x.lang || '').replace('_', '-');
    return v.find(x => norm(x) === lang && /Google|Natural|Neural|Samantha|Daniel|Aria|Jenny|Sonia|Libby/i.test(x.name))
      || v.find(x => norm(x) === lang)
      || v.find(x => norm(x).toLowerCase().startsWith(lang.toLowerCase()))
      || v.find(x => norm(x).startsWith('en'))
      || null;
  },
  speak(text, lang) {
    if (!this.supported) { Toast.show('Trình duyệt này không hỗ trợ phát âm (speechSynthesis).', 'warn'); return; }
    const t = String(text || '').replace(/\*/g, '').trim();
    if (!t) return;
    const synth = window.speechSynthesis;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(t);
    const l = lang || S.settings.voice || 'en-US';
    u.lang = l;
    const voice = this.pick(l);
    if (voice) u.voice = voice;
    u.rate = Number(S.settings.rate) || 0.95;
    setTimeout(() => synth.speak(u), 40);
  }
};

/* =====================================================================
   7. XỬ LÝ VĂN BẢN: highlight / đục lỗ từ trong câu ví dụ
   ===================================================================== */
const Text = {
  find(sentence, word) {
    const raw = String(sentence || '');
    const spans = [];
    let clean = '';
    let last = 0;
    const star = /\*([^*]+)\*/g;
    let m;
    while ((m = star.exec(raw))) {
      clean += raw.slice(last, m.index);
      const s = clean.length;
      clean += m[1];
      spans.push([s, clean.length]);
      last = star.lastIndex;
    }
    clean += raw.slice(last);
    if (spans.length) return { clean, spans };
    const w = U.norm(word);
    if (!w) return { clean, spans };
    const run = pattern => {
      const out = [];
      try {
        const re = new RegExp(pattern, 'gi');
        let mm;
        while ((mm = re.exec(clean))) {
          if (!mm[0].length) { re.lastIndex++; continue; }
          out.push([mm.index, mm.index + mm[0].length]);
        }
      } catch (e) { /* bỏ qua pattern lỗi */ }
      return out;
    };
    const bStart = /\w/.test(w[0]) ? '\\b' : '';
    const bEnd = /\w/.test(w[w.length - 1]) ? '\\b' : '';
    const body = U.reEsc(w).replace(/\s+/g, '\\s+');
    let out = run(bStart + body + '(?:s|es|ed|d|ing|ly|er|est)?' + bEnd);
    if (!out.length && !/\s/.test(w) && w.length >= 4) {
      const stem = w.replace(/(e|y)$/i, '');
      out = run('\\b' + U.reEsc(stem) + '[a-z]*');
    }
    return { clean, spans: out };
  },
  highlight(sentence, word) {
    const { clean, spans } = this.find(sentence, word);
    let html = '', p = 0;
    spans.forEach(([s, e]) => { html += U.esc(clean.slice(p, s)) + `<mark class="mark-word">${U.esc(clean.slice(s, e))}</mark>`; p = e; });
    return html + U.esc(clean.slice(p));
  },
  maskHtml(sentence, word, token = '[...]') {
    const { clean, spans } = this.find(sentence, word);
    if (!spans.length) return null;
    let html = '', p = 0;
    spans.forEach(([s, e]) => { html += U.esc(clean.slice(p, s)) + `<span class="font-semibold text-indigo-500">${token}</span>`; p = e; });
    return html + U.esc(clean.slice(p));
  },
  plain(s) { return String(s || '').replace(/\*/g, ''); },
  multiline(s) { return U.esc(s).replace(/\n/g, '<br>'); }
};

const Toast = {
  show(msg, type = 'info', opts = {}) {
    const o = typeof opts === 'number' ? { duration: opts } : (opts || {});
    const root = document.getElementById('toastRoot');
    if (!root) return;
    while (root.children.length >= 4) root.firstChild.remove();
    const border = { success: 'border-emerald-200 dark:border-emerald-500/30', error: 'border-rose-200 dark:border-rose-500/40', warn: 'border-amber-200 dark:border-amber-500/30', info: 'border-slate-200 dark:border-slate-700' };
    const dot = { success: 'bg-emerald-500', error: 'bg-rose-500', warn: 'bg-amber-500', info: 'bg-indigo-500' };
    const el = document.createElement('div');
    el.className = `toast flex items-center gap-3 w-full md:w-auto max-w-md bg-white dark:bg-slate-800 border ${border[type] || border.info} shadow-lg shadow-slate-900/10 rounded-xl px-4 py-3 text-sm text-slate-700 dark:text-slate-200`;
    el.innerHTML = `<span class="w-2 h-2 rounded-full shrink-0 ${dot[type] || dot.info}"></span><span class="flex-1 leading-snug">${msg}</span>`;
    let timer = null;
    const dismiss = () => { clearTimeout(timer); el.classList.remove('toast-in'); setTimeout(() => el.remove(), 250); };
    if (o.action) {
      const b = document.createElement('button');
      b.className = 'shrink-0 font-semibold text-indigo-600 dark:text-indigo-400 hover:underline px-2 min-h-[36px]';
      b.textContent = o.action.label;
      b.addEventListener('click', () => { try { o.action.fn(); } finally { dismiss(); } });
      el.appendChild(b);
    }
    const x = document.createElement('button');
    x.className = 'shrink-0 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 min-w-[28px] min-h-[28px]';
    x.setAttribute('aria-label', 'Đóng');
    x.textContent = '✕';
    x.addEventListener('click', dismiss);
    el.appendChild(x);
    root.appendChild(el);
    requestAnimationFrame(() => el.classList.add('toast-in'));
    timer = setTimeout(dismiss, o.duration || 2800);
  }
};

const Modal = {
  stack: [],
  open({ title = '', size = 'lg', body = '', onClose = null, dismissible = true } = {}) {
    const widths = { sm: 'md:max-w-md', md: 'md:max-w-lg', lg: 'md:max-w-2xl', xl: 'md:max-w-4xl' };
    const wrap = document.createElement('div');
    wrap.className = 'fixed inset-0 z-50 flex items-end md:items-center justify-center md:p-6';
    wrap.innerHTML = `
      <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm modal-fade" data-modal-bg></div>
      <div class="relative w-full ${widths[size] || widths.lg} max-h-[94vh] md:max-h-[90vh] flex flex-col bg-white dark:bg-slate-800 rounded-t-3xl md:rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 modal-pop" role="dialog" aria-modal="true">
        <div class="flex items-center justify-between gap-3 px-5 md:px-6 py-3.5 border-b border-slate-100 dark:border-slate-700/70">
          <h3 class="font-semibold text-base md:text-lg truncate">${title}</h3>
          <button class="btn-icon -mr-2" data-modal-close aria-label="Đóng">${ic('x', 'w-5 h-5')}</button>
        </div>
        <div class="overflow-y-auto scroll-thin px-5 md:px-6 py-5 pb-safe" data-modal-body>${body}</div>
      </div>`;
    document.getElementById('modalRoot').appendChild(wrap);
    document.body.classList.add('overflow-hidden');
    const entry = { el: wrap, onClose };
    wrap.querySelector('[data-modal-close]').addEventListener('click', () => this.close(entry));
    wrap.querySelector('[data-modal-bg]').addEventListener('click', () => { if (dismissible) this.close(entry); });
    this.stack.push(entry);
    lucide.createIcons();
    return { el: wrap, body: wrap.querySelector('[data-modal-body]'), close: () => this.close(entry) };
  },
  close(entry) {
    const e = entry || this.stack[this.stack.length - 1];
    if (!e || !this.stack.includes(e)) return;
    this.stack = this.stack.filter(x => x !== e);
    e.el.remove();
    if (!this.stack.length) document.body.classList.remove('overflow-hidden');
    if (e.onClose) { try { e.onClose(); } catch (err) { console.error(err); } }
  },
  isOpen() { return this.stack.length > 0; },
  confirm({ title = 'Xác nhận', message = '', confirmText = 'Xác nhận', cancelText = 'Hủy', danger = false } = {}) {
    return new Promise(resolve => {
      let done = false;
      const m = this.open({
        title, size: 'sm',
        body: `<div class="text-slate-600 dark:text-slate-300 leading-relaxed">${message}</div>
          <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 mt-6">
            <button class="btn btn-secondary" data-c="0">${cancelText}</button>
            <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-c="1">${confirmText}</button>
          </div>`,
        onClose: () => { if (!done) { done = true; resolve(false); } }
      });
      m.body.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => { done = true; resolve(b.dataset.c === '1'); m.close(); }));
      setTimeout(() => { const b = m.body.querySelector('[data-c="1"]'); if (b) b.focus(); }, 60);
    });
  },
  choice({ title = 'Chọn', message = '', options = [] } = {}) {
    return new Promise(resolve => {
      let done = false;
      const m = this.open({
        title, size: 'md',
        body: `${message ? `<div class="text-slate-600 dark:text-slate-300 leading-relaxed mb-4">${message}</div>` : ''}
          <div class="space-y-2">${options.map((o, i) => `
            <button class="w-full text-left card p-4 hover:border-indigo-400 dark:hover:border-indigo-400 transition-colors flex items-start gap-3 ${o.danger ? 'hover:!border-rose-400' : ''}" data-opt="${i}">
              <span class="text-xl leading-none mt-0.5">${o.icon || '•'}</span>
              <span class="flex-1"><span class="block font-semibold ${o.danger ? 'text-rose-600 dark:text-rose-400' : ''}">${o.label}</span>${o.desc ? `<span class="block text-sm muted mt-0.5">${o.desc}</span>` : ''}</span>
            </button>`).join('')}
          </div>
          <div class="flex justify-end mt-4"><button class="btn btn-ghost" data-opt="-1">Hủy</button></div>`,
        onClose: () => { if (!done) { done = true; resolve(null); } }
      });
      m.body.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => {
        done = true;
        const i = Number(b.dataset.opt);
        resolve(i < 0 ? null : options[i].value);
        m.close();
      }));
    });
  }
};

function emptyFormData() {

        title: 'Từ này đã có trong kho',
        message: `<b>${U.esc(dup.word)}</b> — ${U.esc(dup.meaning)}`,
        options: [
          { value: 'merge', icon: '🔀', label: 'Gộp vào từ cũ', desc: 'Bổ sung nghĩa, ví dụ, chủ đề, mẹo nhớ mới vào từ đã có (giữ nguyên tiến độ học).' },
          { value: 'edit', icon: '✏️', label: 'Mở từ cũ để sửa', desc: 'Xem và chỉnh sửa trực tiếp từ đã lưu.' },
          { value: 'new', icon: '➕', label: 'Vẫn thêm thành từ mới', desc: 'Dùng khi đây là một nghĩa/cách dùng khác hoàn toàn.' }
        ]
      });
      if (!c) return;
      if (c === 'edit') { openEdit(dup.id); return; }
      if (c === 'merge') {
        Store.mergeInto(dup, d);
        Store.saveItems();
        Toast.show(`🔀 Đã gộp thông tin mới vào "<b>${U.esc(dup.word)}</b>"`, 'success');
        reset();
        f.word.focus();
        if (opts.onSaved) opts.onSaved(dup);
        return;
      }
    }
    const item = Store.add(d);
    Toast.show(`✅ Đã thêm "<b>${U.esc(item.word)}</b>" · Kho hiện có ${S.items.length} từ`, 'success');
    reset();
    f.word.focus();
    renderNav();
    renderBackupReminder();
    if (opts.onSaved) opts.onSaved(item);
  }

  /* ---- Sự kiện ---- */
  form.addEventListener('submit', e => { e.preventDefault(); submit(); });
  root.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || !root.contains(b)) return;
    if (b.dataset.posId) { data.pos = data.pos === b.dataset.posId ? '' : b.dataset.posId; renderPos(); saveDraft(); return; }
    if (b.dataset.tag) { const t = b.dataset.tag; data.tags = data.tags.includes(t) ? data.tags.filter(x => x !== t) : [...data.tags, t]; renderTags(); saveDraft(); return; }
    if (b.dataset.accentV) { S.settings.voice = b.dataset.accentV; Store.saveSettings(); renderAccent(); Speech.speak(data.word || 'Hello'); return; }
    if (b.dataset.memToggle) { const id = b.dataset.memToggle; if (openMem.has(id)) openMem.delete(id); else openMem.add(id); renderMem(); const ta = root.querySelector(`[data-mem="${id}"]`); if (ta) ta.focus(); return; }
    const act = b.dataset.wf;
    if (!act) return;
    if (act === 'speak') { if (!U.norm(data.word)) { Toast.show('Nhập từ vựng trước để nghe thử.', 'warn'); f.word.focus(); return; } Speech.speak(data.word); }
    else if (act === 'speak-ex') { const e2 = data.examples[Number(b.dataset.i)]; if (e2 && e2.en) Speech.speak(e2.en); }
    else if (act === 'add-ex') { data.examples.push({ en: '', vi: '' }); renderExamples(); const el = root.querySelector(`[data-ex-en="${data.examples.length - 1}"]`); if (el) el.focus(); }
    else if (act === 'del-ex') { data.examples.splice(Number(b.dataset.i), 1); if (!data.examples.length) data.examples.push({ en: '', vi: '' }); renderExamples(); saveDraft(); }
    else if (act === 'add-tag') { addTagFromInput(); f.tagInput.focus(); }
    else if (act === 'open-dup') { openEdit(b.dataset.id); }
    else if (act === 'clear') { reset(); data.tags = []; renderTags(); f.word.focus(); Toast.show('Đã làm mới form.', 'info'); }
    else if (act === 'discard-draft') { reset(); data.tags = []; renderTags(); Toast.show('Đã bỏ bản nháp.', 'info'); }
    else if (act === 'cancel') { if (opts.onCancel) opts.onCancel(); }
    else if (act === 'delete') { if (opts.onDelete) opts.onDelete(); }
  });
  root.addEventListener('input', e => {
    const t = e.target;
    if (t === f.word) { data.word = t.value; runDup(); updateExPreviews(); }
    else if (t === f.meaning) data.meaning = t.value;
    else if (t === f.ipa) data.ipa = t.value;
    else if (t.dataset.exEn !== undefined) { const i = Number(t.dataset.exEn); data.examples[i].en = t.value; const p = root.querySelector(`[data-ex-prev="${i}"]`); if (p) p.innerHTML = exPreview(i); }
    else if (t.dataset.exVi !== undefined) data.examples[Number(t.dataset.exVi)].vi = t.value;
    else if (t.dataset.mem) data.memory[t.dataset.mem] = t.value;
    else if (t === f.tagInput) return;
    saveDraft();
  });
  f.word.addEventListener('blur', () => { const n = U.norm(f.word.value); if (n !== f.word.value) { f.word.value = n; data.word = n; saveDraft(); } checkDup(); });
  f.ipa.addEventListener('blur', () => { if (U.norm(f.ipa.value)) { f.ipa.value = normalizeIpa(f.ipa.value); data.ipa = f.ipa.value; saveDraft(); } });
  root.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    const t = e.target;
    if (e.ctrlKey || e.metaKey) { e.preventDefault(); submit(); return; }
    if (t === f.tagInput) { e.preventDefault(); if (!addTagFromInput()) submit(); return; }
    if (t.tagName === 'INPUT') { e.preventDefault(); submit(); }
  });

  fillInputs(); renderPos(); renderAccent(); renderTags(); renderExamples(); renderMem(); checkDup();

  const api = {
    focus() { f.word.focus(); },
    flush() { saveDraft.flush(); },
    destroy() { saveDraft.flush(); ActiveForms.delete(api); }
  };
  ActiveForms.add(api);
  return api;
}

function rerenderCurrent() {
  if (S.session.view === 'add') AddView.refreshSide();
  else render();
}

function quickAdd() {
  if (Modal.isOpen()) return;
  if (S.session.view === 'add' && S.session.addTab === 'single' && AddView.form) { AddView.form.focus(); return; }
  let form = null;
  const m = Modal.open({ title: '➕ Thêm từ vựng mới', size: 'xl', onClose: () => { if (form) form.destroy(); if (S.session.view !== 'study' && S.session.view !== 'test') render(); else renderNav(); } });
  form = WordForm(m.body, { mode: 'add' });
  setTimeout(() => form.focus(), 80);
}

function openEdit(id, after) {
  const it = Store.get(id);
  if (!it) { Toast.show('Không tìm thấy từ này (có thể đã bị xóa).', 'warn'); return; }
  let form = null;
  const m = Modal.open({ title: `✏️ Sửa từ: ${U.esc(it.word)}`, size: 'xl', onClose: () => { if (form) form.destroy(); } });
  form = WordForm(m.body, {
    mode: 'edit',
    itemId: id,
    onSaved: () => { m.close(); (after || rerenderCurrent)(); },
    onCancel: () => m.close(),
    onDelete: async () => { const ok = await deleteWord(id, () => {}); if (ok) { m.close(); (after || rerenderCurrent)(); } }
  });
  setTimeout(() => form.focus(), 80);
}

async function deleteWord(id, after) {
  const it = Store.get(id);
  if (!it) return false;
  const ok = await Modal.confirm({ title: 'Xóa từ vựng?', message: `Từ <b>${U.esc(it.word)}</b> cùng toàn bộ ví dụ, mẹo nhớ và lịch sử ôn tập sẽ bị xóa khỏi kho.`, confirmText: 'Xóa', danger: true });
  if (!ok) return false;
  const idx = S.items.indexOf(it);
  const snapshot = U.clone(it);
  Store.remove(id);
  Toast.show(`🗑️ Đã xóa "<b>${U.esc(snapshot.word)}</b>"`, 'info', {
    duration: 6000,
    action: {
      label: 'Hoàn tác',
      fn: () => {
        if (Store.get(snapshot.id)) return;
        S.items.splice(Math.min(Math.max(idx, 0), S.items.length), 0, sanitizeItem(snapshot));
        delete S.tombstones[snapshot.id];
        Store.saveItems(); Store.saveTomb();
        Toast.show('↩️ Đã khôi phục từ vựng.', 'success');
        rerenderCurrent();
      }
    }
  });
  renderNav();
  (after || rerenderCurrent)();
  return true;
}

/* =====================================================================
   10. NHẬP HÀNG LOẠT (BULK IMPORT)
   ===================================================================== */
const Bulk = {
  splitLine(line) {
    if (line.includes('|')) return line.split('|');
    if (line.includes('\t')) return line.split('\t');
    let parts = line.split(/\s+[-–—]\s+/);
    if (parts.length === 1) {
      const m = line.match(/^([^:=]+?)\s*[:=]\s*(.+)$/);
      if (m) parts = [m[1], m[2]];
    }
    return parts;
  },
  parse(text, defaultTag) {
    const rows = [];
    const seen = new Set();
    String(text || '').split(/\r?\n/).forEach((raw, idx) => {
      const line = raw.trim();
      if (!line || line.startsWith('#')) return;
      const parts = this.splitLine(line).map(s => s.trim());
      const first = (parts[0] || '').toLowerCase();
      if (['từ vựng', 'tu vung', 'word', 'từ', 'vocabulary'].includes(first)) return;
      const d = { word: '', pos: '', ipa: '', meaning: '', example: '', note: '', tags: '' };
      if (parts.length >= 4) {
        [d.word = '', d.pos = '', d.ipa = '', d.meaning = '', d.example = '', d.note = '', d.tags = ''] = parts;
      } else {
        d.word = parts[0] || ''; d.meaning = parts[1] || ''; d.example = parts[2] || '';
      }
      const examples = d.example
        ? d.example.split(/\s*;;\s*/).map(s => { const [en, vi = ''] = s.split(/\s*\/\/\s*/); return { en: U.norm(en), vi: U.norm(vi) }; }).filter(e => e.en)
        : [];
      const tags = [...String(d.tags).split(/[,;]/), defaultTag || ''].map(t => U.norm(t).replace(/^#/, '')).filter(Boolean);
      const item = {
        word: U.norm(d.word), meaning: d.meaning.trim(), pos: normalizePos(d.pos), ipa: normalizeIpa(d.ipa), examples,
        memory: { mnemonic: d.note.trim(), collocations: '', personal: '', roots: '' }, tags: [...new Set(tags)]
      };
      let status = 'new', msg = 'Từ mới';
      const k = U.key(item.word);
      if (!item.word) { status = 'error'; msg = 'Thiếu từ vựng'; }
      else if (!item.meaning) { status = 'error'; msg = 'Thiếu nghĩa'; }
      else if (seen.has(k)) { status = 'dupBatch'; msg = 'Trùng trong danh sách'; }
      else if (Store.findByWord(item.word)) { status = 'dup'; msg = 'Đã có trong kho'; }
      if (k) seen.add(k);
      rows.push({ line: idx + 1, item, status, msg });
    });
    return rows;
  },
  sample: [
    'resilient | adj | /rɪˈzɪl.i.ənt/ | kiên cường, mau phục hồi | She is remarkably *resilient* after every failure. // Cô ấy kiên cường đáng kể sau mỗi lần thất bại. | re (lại) + salire (nhảy) → bật trở lại | IELTS, Tính cách',
    'procrastinate | v | /prəˈkræs.tɪ.neɪt/ | trì hoãn | I tend to procrastinate when a task feels too big. // Tôi hay trì hoãn khi việc quá lớn. | "Pro-cờ-rát-tí-nết": để mai rồi tính | Thói quen',
    'break the ice - phá vỡ sự ngại ngùng - He told a joke to break the ice.',
    'meticulous - tỉ mỉ, kỹ lưỡng - She keeps meticulous notes of every meeting.'
  ].join('\n')
};

            </thead>
            <tbody class="divide-y divide-slate-100 dark:divide-slate-700/60">
              ${rows.map(r => `<tr class="${r.status === 'error' ? 'bg-rose-50/40 dark:bg-rose-500/5' : ''}">

                <td class="px-4 py-2.5 hidden md:table-cell">${tagChips(r.item.tags, 3) || '<span class="muted">—</span>'}</td>
                <td class="px-4 py-2.5"><span class="badge ${stCls[r.status]} whitespace-nowrap">${r.msg}</span></td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
    lucide.createIcons();
  },
  saveBulk() {
    const bd = S.bulkDraft || {};
    const rows = Bulk.parse(bd.text, bd.tag);
    const fresh = rows.filter(r => r.status === 'new').map(r => r.item);
    let merged = 0;
    if (bd.dupMode === 'merge') {
      rows.filter(r => r.status === 'dup').forEach(r => { const ex = Store.findByWord(r.item.word); if (ex) { Store.mergeInto(ex, r.item); merged++; } });
    }
    if (!fresh.length && !merged) { Toast.show('Không có dòng hợp lệ nào để lưu.', 'warn'); return; }
    if (fresh.length) Store.addMany(fresh);
    else Store.saveItems();
    S.bulkDraft = { text: '', tag: bd.tag || '', dupMode: bd.dupMode || 'skip' };
    StorageManager.save('bulk_draft', S.bulkDraft);
    Toast.show(`⚡ Đã lưu ${fresh.length} từ mới${merged ? `, gộp ${merged} từ` : ''} · Kho hiện có ${S.items.length} từ`, 'success', 4000);
    renderNav();
    renderBackupReminder();
    this.render();
  }
};

      S.items.push(it);

/* =====================================================================
   14. PHÂN KHU 2: HỌC FLASHCARD & PHƯƠNG PHÁP GHI NHỚ (3D + SRS)
   ===================================================================== */
const Study = {
  poolFor(cfg) {
    const f = cfg.filter || 'due';
    if (f === 'due') return Store.due();
    if (f === 'new') return S.items.filter(i => (i.level || 0) === 0);
    if (f === 'hard') return S.items.filter(i => Store.isHard(i));
    if (f === 'tag') return S.items.filter(i => cfg.tag && i.tags.includes(cfg.tag));
    return [...S.items];
  },
  filterTitle(cfg) {
    const map = { due: 'Từ cần ôn hôm nay', new: 'Từ mới thêm', hard: 'Từ hay sai (Khó)', tag: `Chủ đề #${cfg.tag || ''}`, all: 'Tất cả từ trong kho' };
    return map[cfg.filter] || 'Phiên học Flashcard';
  },
  startWithIds(ids, title = 'Phiên ôn tập') {
    const valid = ids.filter(id => Store.get(id));
    if (!valid.length) { Toast.show('Không có từ nào phù hợp để bắt đầu phiên học.', 'warn'); return; }
    S.session.flashcard = {
      id: U.uid(),
      title,
      queue: valid,
      initialCount: valid.length,
      index: 0,
      flipped: false,
      hint: false,
      grades: { 1: 0, 2: 0, 3: 0, 4: 0 },
      requeued: {},
      wrongIds: [],
      startedAt: Date.now()
    };
    S.session.view = 'study';
    Store.saveSession();
    render();
    if (S.settings.autoSpeak) {
      const cur = this.currentItem();
      if (cur) setTimeout(() => Speech.speak(cur.word), 180);
    }
  },
  startFromConfig() {
    const cfg = S.session.studyConfig;
    if (cfg.filter === 'tag' && !cfg.tag) {
      const firstTag = Store.tags()[0];
      if (firstTag) cfg.tag = firstTag.tag;
    }
    let pool = this.poolFor(cfg);
    if (!pool.length && cfg.filter === 'due' && S.items.length) {
      Toast.show('Bạn đã ôn hết từ đến hạn hôm nay — chuyển sang ôn toàn bộ kho từ!', 'info');
      pool = [...S.items];
    }
    if (!pool.length) {
      Toast.show('Chưa có từ nào trong bộ lọc này.', 'warn');
      return;
    }
    let list = cfg.shuffle ? U.shuffle(pool) : [...pool].sort((a, b) => (a.nextReview || 0) - (b.nextReview || 0));
    const lim = Number(cfg.limit) || 0;
    if (lim > 0) list = list.slice(0, lim);
    this.startWithIds(list.map(i => i.id), this.filterTitle(cfg));
  },
  currentItem() {
    const fc = S.session.flashcard;
    if (!fc || !Array.isArray(fc.queue)) return null;
    while (fc.index < fc.queue.length && !Store.get(fc.queue[fc.index])) fc.index++;
    return fc.index < fc.queue.length ? Store.get(fc.queue[fc.index]) : null;
  },
  flip() {
    const fc = S.session.flashcard;
    if (!fc || !this.currentItem()) return;
    fc.flipped = !fc.flipped;
    Store.saveSession();
    const card = document.querySelector('[data-fc-card]');
    if (card) card.classList.toggle('is-flipped', fc.flipped);
    const bar = document.getElementById('fcGradeBar');
    if (bar) bar.innerHTML = this.renderGradeBar(this.currentItem(), fc.flipped);
    lucide.createIcons();
  },
  toggleHint() {
    const fc = S.session.flashcard;
    if (!fc || !this.currentItem()) return;
    fc.hint = !fc.hint;
    Store.saveSession();
    const box = document.getElementById('fcHintBox');
    if (box) box.innerHTML = fc.hint ? this.renderHintContent(this.currentItem()) : '';
    lucide.createIcons();
  },
  speakWord() {
    const it = this.currentItem();
    if (it) Speech.speak(it.word);
  },
  speakExample(idx = 0) {
    const it = this.currentItem();
    if (!it) return;
    const ex = it.examples[idx] || it.examples[0];
    if (ex && ex.en) Speech.speak(ex.en);
    else Toast.show('Từ này chưa có câu ví dụ để phát âm.', 'info');
  },
  grade(g) {
    const fc = S.session.flashcard;
    const it = this.currentItem();
    if (!fc || !it) return;
    SRS.apply(it, g);
    fc.grades[g] = (fc.grades[g] || 0) + 1;
    if (g === 1) {
      if (!fc.wrongIds.includes(it.id)) fc.wrongIds.push(it.id);
      const rq = (fc.requeued[it.id] || 0);
      if (rq < 2) {
        fc.queue.push(it.id);
        fc.requeued[it.id] = rq + 1;
      }
    }
    fc.index++;
    fc.flipped = false;
    fc.hint = false;
    Store.saveItems();
    Store.saveSession();
    recordActivity(it.id);
    this.render();
    if (S.settings.autoSpeak) {
      const next = this.currentItem();
      if (next) setTimeout(() => Speech.speak(next.word), 180);
    }
  },
  prevCard() {
    const fc = S.session.flashcard;
    if (!fc || fc.index <= 0) return;
    fc.index--;
    fc.flipped = false;
    fc.hint = false;
    Store.saveSession();
    this.render();
  },
  exitSession() {
    S.session.flashcard = null;
    Store.saveSession();
    this.render();
  },
  renderHintContent(item) {
    const parts = [];
    const ex = item.examples[0];
    if (ex && ex.en) {
      const masked = Text.maskHtml(ex.en, item.word, '[ ... ]');
      parts.push(`<div><span class="text-xs font-semibold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">Ngữ cảnh gợi ý:</span><div class="mt-1 text-base leading-relaxed">${masked || U.esc(Text.plain(ex.en))}</div>${ex.vi ? `<div class="text-xs muted mt-0.5">${U.esc(ex.vi)}</div>` : ''}</div>`);
    }
    if (item.memory && item.memory.mnemonic) {
      parts.push(`<div><span class="text-xs font-semibold uppercase tracking-wider text-amber-600 dark:text-amber-400">🧠 Mẹo nhớ Mnemonic:</span><div class="mt-0.5 text-sm leading-relaxed">${U.esc(item.memory.mnemonic)}</div></div>`);
    }
    if (!parts.length) {
      const w = item.word.trim();
      const ch = w.length > 2 ? `${w[0]} ${'_ '.repeat(Math.min(8, w.length - 2))}${w[w.length - 1]}` : w[0];
      parts.push(`<div class="text-sm">Chữ cái gợi ý: <b class="font-mono">${U.esc(ch)}</b> · Nghĩa bắt đầu bằng: <b>"${U.esc(item.meaning.slice(0, Math.min(12, Math.ceil(item.meaning.length / 2))))}..."</b></div>`);
    }
    return `<div class="rounded-2xl border border-amber-200 dark:border-amber-500/30 bg-amber-50/80 dark:bg-amber-500/10 px-4 py-3 text-left space-y-2 max-w-xl mx-auto">${parts.join('<hr class="border-amber-200/60 dark:border-amber-500/20">')}</div>`;
  },
  renderGradeBar(item, flipped) {
    if (!item) return '';
    const g1 = SRS.compute(item, 1), g2 = SRS.compute(item, 2), g3 = SRS.compute(item, 3), g4 = SRS.compute(item, 4);
    return `
      <div class="space-y-2">
        ${!flipped ? `<div class="text-center text-xs muted">Chạm vào thẻ (hoặc nhấn <span class="kbd">Space</span>) để lật xem đáp án trước khi đánh giá độ nhớ</div>` : ''}
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5">
          <button class="btn flex-col !py-2.5 !min-h-[60px] rounded-2xl border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-700 dark:border-rose-500/30 dark:bg-rose-500/15 dark:hover:bg-rose-500/25 dark:text-rose-200" data-action="fc-grade" data-grade="1">
            <div class="font-bold text-sm flex items-center gap-1.5"><span>1. Quên</span><span class="kbd !bg-white/70 dark:!bg-slate-800">1</span></div>
            <div class="text-[11px] opacity-80">Học lại ngay trong phiên</div>
          </button>
          <button class="btn flex-col !py-2.5 !min-h-[60px] rounded-2xl border border-amber-200 bg-amber-50 hover:bg-amber-100 text-amber-800 dark:border-amber-500/30 dark:bg-amber-500/15 dark:hover:bg-amber-500/25 dark:text-amber-200" data-action="fc-grade" data-grade="2">
            <div class="font-bold text-sm flex items-center gap-1.5"><span>2. Khó</span><span class="kbd !bg-white/70 dark:!bg-slate-800">2</span></div>
            <div class="text-[11px] opacity-80">Ôn lại sau ${SRS.label(g2.days)}</div>
          </button>
          <button class="btn flex-col !py-2.5 !min-h-[60px] rounded-2xl border border-sky-200 bg-sky-50 hover:bg-sky-100 text-sky-700 dark:border-sky-500/30 dark:bg-sky-500/15 dark:hover:bg-sky-500/25 dark:text-sky-200" data-action="fc-grade" data-grade="3">
            <div class="font-bold text-sm flex items-center gap-1.5"><span>3. Nhớ</span><span class="kbd !bg-white/70 dark:!bg-slate-800">3</span></div>
            <div class="text-[11px] opacity-80">Ôn lại sau ${SRS.label(g3.days)}</div>
          </button>
          <button class="btn flex-col !py-2.5 !min-h-[60px] rounded-2xl border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 dark:border-emerald-500/30 dark:bg-emerald-500/15 dark:hover:bg-emerald-500/25 dark:text-emerald-200" data-action="fc-grade" data-grade="4">
            <div class="font-bold text-sm flex items-center gap-1.5"><span>4. Rất dễ</span><span class="kbd !bg-white/70 dark:!bg-slate-800">4</span></div>
            <div class="text-[11px] opacity-80">Tăng cấp · ${SRS.label(g4.days)}</div>
          </button>
        </div>
      </div>`;
  },
  render() {
    const v = document.getElementById('view');
    if (!S.items.length) {
