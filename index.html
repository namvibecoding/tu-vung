/* =====================================================================
   15. PHÂN KHU 3: KIỂM TRA ĐA CHẾ ĐỘ (INTERACTIVE TEST & QUIZ ENGINE)
   ===================================================================== */
const Test = {
  timer: null,
  startTimer() {
    this.stopTimer();
    const t = S.session.test;
    if (!t || t.phase !== 'running') return;
    t.lastTick = Date.now();
    this.timer = setInterval(() => {
      if (S.session.view !== 'test' || !S.session.test || S.session.test.phase !== 'running') { this.stopTimer(); return; }
      this.syncElapsed();
      const el = document.getElementById('testClock');
      if (el) el.textContent = U.clock(S.session.test.elapsed || 0);
    }, 1000);
  },
  stopTimer() { if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  syncElapsed() {
    const t = S.session.test;
    if (!t || t.phase !== 'running') return;
    const now = Date.now();
    if (t.lastTick) t.elapsed = (t.elapsed || 0) + Math.min(15000, Math.max(0, now - t.lastTick));
    t.lastTick = now;
  },
  poolFor(cfg) {
    if (cfg.scope === 'due') {
      const due = Store.due();
      return due.length ? due : [...S.items];
    }
    if (cfg.scope === 'hard') {
      const hard = S.items.filter(i => Store.isHard(i));
      return hard.length ? hard : [...S.items];
    }
    if (cfg.scope === 'tag') {
      const byTag = S.items.filter(i => cfg.tag && i.tags.includes(cfg.tag));
      return byTag.length ? byTag : [...S.items];
    }
    return [...S.items];
  },
  buildDistractors(item, mode) {
    if (mode === 'w2m') {
      const others = U.shuffle(S.items.filter(i => i.id !== item.id && U.key(i.meaning) !== U.key(item.meaning))).map(i => i.meaning);
      const fb = U.shuffle(FALLBACK_MEANINGS.filter(m => U.key(m) !== U.key(item.meaning) && !others.some(o => U.key(o) === U.key(m))));
      const picks = [...others, ...fb].slice(0, 3);
      return U.shuffle([item.meaning, ...picks]);
    } else {
      const others = U.shuffle(S.items.filter(i => i.id !== item.id && U.key(i.word) !== U.key(item.word))).map(i => i.word);
      const fb = U.shuffle(FALLBACK_WORDS.filter(w => U.key(w) !== U.key(item.word) && !others.some(o => U.key(o) === U.key(w))));
      const picks = [...others, ...fb].slice(0, 3);
      return U.shuffle([item.word, ...picks]);
    }
  },
  spellingHint(word) {
    const w = U.norm(word);
    const chars = [...w];
    const letters = chars.filter(c => /\S/.test(c)).length;
    const masked = chars.map((c, idx) => {
      if (/\s/.test(c)) return '   ';
      if (idx === 0 || (w.length >= 5 && idx === chars.length - 1)) return c;
      return '_';
    }).join(' ');
    return `${masked} (${letters} ký tự)`;
  },
  makeQuestion(item, rawType) {
    let type = rawType;
    if (type === 'cloze') {
      const validEx = (item.examples || []).find(e => e.en && Text.find(e.en, item.word).spans.length > 0);
      if (validEx) {
        const bank = this.buildDistractors(item, 'm2w');
        return {
          id: U.uid(),
          itemId: item.id,
          type: 'cloze',
          word: item.word,
          meaning: item.meaning,
          pos: item.pos,
          ipa: item.ipa,
          sentence: validEx.en,
          sentenceVi: validEx.vi || '',
          bank,
          answered: false,
          userAnswer: '',
          correct: false
        };
      }
      type = 'recall';
    }
    if (type === 'mc') {
      const dir = Math.random() < 0.5 ? 'w2m' : 'm2w';
      return {
        id: U.uid(),
        itemId: item.id,
        type: 'mc',
        dir,
        word: item.word,
        meaning: item.meaning,
        pos: item.pos,
        ipa: item.ipa,
        options: this.buildDistractors(item, dir),
        answered: false,
        userAnswer: '',
        correct: false
      };
    }
    if (type === 'dictation') {
      return {
        id: U.uid(),
        itemId: item.id,
        type: 'dictation',
        word: item.word,
        meaning: item.meaning,
        pos: item.pos,
        ipa: item.ipa,
        hint: this.spellingHint(item.word),
        answered: false,
        userAnswer: '',
        correct: false
      };
    }
    if (type === 'sentence') {
      return {
        id: U.uid(),
        itemId: item.id,
        type: 'sentence',
        word: item.word,
        meaning: item.meaning,
        pos: item.pos,
        ipa: item.ipa,
        examples: U.clone(item.examples || []),
        answered: false,
        userAnswer: '',
        correct: false
      };
    }
    return {
      id: U.uid(),
      itemId: item.id,
      type: 'recall',
      word: item.word,
      meaning: item.meaning,
      pos: item.pos,
      ipa: item.ipa,
      hint: this.spellingHint(item.word),
      answered: false,
      userAnswer: '',
      correct: false
    };
  },
  start(customItems = null) {
    if (!S.items.length) { Toast.show('Kho từ đang trống — hãy thêm ít nhất 1 từ để làm bài Test.', 'warn'); return; }
    const cfg = S.session.testConfig;
    const types = Array.isArray(cfg.types) && cfg.types.length ? cfg.types : ['mc', 'cloze', 'dictation', 'sentence'];
    cfg.types = types;
    let pool = customItems || this.poolFor(cfg);
    if (!pool.length) pool = [...S.items];
    pool = U.shuffle(pool);
    const wanted = Number(cfg.count) === 0 ? pool.length : Math.min(Number(cfg.count) || 10, pool.length);
    const picked = pool.slice(0, Math.max(1, wanted));
    const questions = picked.map((it, idx) => this.makeQuestion(it, types[idx % types.length]));

    S.session.test = {
      id: U.uid(),
      phase: 'running',
      questions,
      index: 0,
      startedAt: Date.now(),
      lastTick: Date.now(),
      elapsed: 0
    };
    S.session.view = 'test';
    Store.saveSession();
    this.render();
    const q0 = questions[0];
    if (q0 && q0.type === 'dictation') setTimeout(() => Speech.speak(q0.word), 250);
  },
  currentQ() {
    const t = S.session.test;
    if (!t || !Array.isArray(t.questions)) return null;
    return t.questions[t.index] || null;
  },
  checkAnswer(val) {
    const t = S.session.test;
    const q = this.currentQ();
    if (!t || !q || q.answered) return;
    const ans = String(val == null ? '' : val).trim();
    if (!ans) { Toast.show('Hãy nhập hoặc chọn đáp án trước khi kiểm tra.', 'warn'); return; }

    let ok = false;
    if (q.type === 'mc') {
      const target = q.dir === 'w2m' ? q.meaning : q.word;
      ok = U.answerNorm(ans) === U.answerNorm(target);
    } else if (q.type === 'sentence') {
      const found = Text.find(ans, q.word).spans.length > 0 || U.answerNorm(ans).includes(U.answerNorm(q.word));
      const wordsCount = ans.split(/\s+/).filter(Boolean).length;
      ok = found && wordsCount >= 3;
      q.feedback = !found
        ? `Câu của bạn chưa xuất hiện từ "${q.word}" (hoặc dạng chia của từ).`
        : (wordsCount < 3 ? 'Hãy viết một câu đầy đủ (tối thiểu 3 từ).' : 'Tuyệt vời! Bạn đã đặt câu đúng ngữ cảnh chứa từ vựng.');
    } else {
      const expected = U.answerNorm(q.word);
      const given = U.answerNorm(ans);
      let matchedSpan = false;
      if (q.type === 'cloze' && q.sentence) {
        const sp = Text.find(q.sentence, q.word);
        if (sp.spans.length) {
          const surface = sp.clean.slice(sp.spans[0][0], sp.spans[0][1]);
          if (U.answerNorm(surface) === given) matchedSpan = true;
        }
      }
      ok = given === expected || matchedSpan;
      if (!ok && expected.length >= 6 && U.lev(given, expected) === 1) {
        q.nearMiss = true;
      }
    }

    q.userAnswer = ans;
    q.correct = ok;
    q.answered = true;

    const item = Store.get(q.itemId);
    if (item) {
      SRS.applyTest(item, ok);
      Store.saveItems();
      recordActivity(item.id);
    }
    this.syncElapsed();
    Store.saveSession();
    this.render();
  },
  overrideSentenceGrade(ok) {
    const q = this.currentQ();
    if (!q || !q.answered) return;
    if (q.correct === ok) return;
    q.correct = ok;
    const item = Store.get(q.itemId);
    if (item) {
      if (ok) { item.wrong = Math.max(0, item.wrong - 1); SRS.applyTest(item, true); }
      else { item.correct = Math.max(0, item.correct - 1); SRS.applyTest(item, false); }
      Store.saveItems();
    }
    Store.saveSession();
    this.render();
  },
  next() {
    const t = S.session.test;
    if (!t) return;
    this.syncElapsed();
    if (t.index + 1 < t.questions.length) {
      t.index++;
      Store.saveSession();
      this.render();
      const q = this.currentQ();
      if (q && q.type === 'dictation') setTimeout(() => Speech.speak(q.word), 200);
    } else {
      this.finish();
    }
  },
  finish() {
    const t = S.session.test;
    if (!t) return;
    this.syncElapsed();
    this.stopTimer();
    t.phase = 'done';
    t.finishedAt = Date.now();
    const total = t.questions.length;
    const right = t.questions.filter(q => q.correct).length;
    const score = total ? Math.round((right / total) * 100) : 0;
    t.score = score;
    t.right = right;
    if (!S.stats.testResults) S.stats.testResults = [];
    S.stats.testResults.unshift({
      id: t.id,
      at: t.finishedAt,
      score,
      right,
      total,
      elapsed: t.elapsed || 0,
      wrongIds: t.questions.filter(q => !q.correct).map(q => q.itemId)
    });
    if (S.stats.testResults.length > 40) S.stats.testResults = S.stats.testResults.slice(0, 40);
    Store.saveStats();
    Store.saveSession();
    if (Cloud.configured() && S.settings.cloud.autoSync && navigator.onLine) Cloud.sync({ silent: true });
    Toast.show(`🏁 Hoàn thành bài Test: ${right}/${total} câu đúng (${score}%)`, score >= 80 ? 'success' : 'info', 4000);
    this.render();
  },
  resetToSetup() {
    this.stopTimer();
    S.session.test = null;
    Store.saveSession();
    this.render();
  },
  render() {
    const v = document.getElementById('view');
    if (!S.items.length) {
      v.innerHTML = emptyBlock({
        icon: '📝',
        title: 'Chưa có từ vựng để tạo đề kiểm tra',
        desc: 'Hãy thêm ít nhất 1 từ vựng vào kho — hệ thống sẽ tự động sinh câu hỏi Trắc nghiệm, Điền từ, Chính tả và Đặt câu.',
        actions: `<button class="btn btn-primary" data-action="go" data-view="add">➕ Thêm từ mới</button><button class="btn btn-secondary" data-action="load-samples">✨ Nạp thử 5 từ mẫu</button>`
      });
      return;
    }
    const t = S.session.test;
    if (!t) {
      this.stopTimer();
      v.innerHTML = this.renderSetup();
      return;
    }
    if (t.phase === 'done') {
      this.stopTimer();
      v.innerHTML = this.renderResult(t);
      return;
    }
    this.startTimer();
    v.innerHTML = this.renderRunning(t);
    const inp = v.querySelector('[data-test-input]');
    if (inp && !this.currentQ().answered) setTimeout(() => inp.focus(), 60);
  },
  renderSetup() {
    const cfg = S.session.testConfig;
    const tags = Store.tags();
    const poolCount = this.poolFor(cfg).length;
    const recentTests = (S.stats.testResults || []).slice(0, 5);
    return `
      <div class="space-y-6">
        <div>
          <h2 class="text-2xl font-bold tracking-tight">Kiểm tra đa chế độ (Interactive Quiz)</h2>
          <p class="muted mt-1">Kết quả bài làm tự động cập nhật trực tiếp vào cấp độ SRS của từng từ.</p>
        </div>

        <div class="grid lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2 card p-5 md:p-6 space-y-6">
            <div>
              <label class="label">1. Chọn phạm vi từ vựng</label>
              <div class="flex flex-wrap gap-2">
                <button class="chip ${cfg.scope === 'due' ? 'chip-active' : ''}" data-action="test-scope" data-scope="due">⏰ Từ cần ôn (${Store.due().length || S.items.length})</button>
                <button class="chip ${cfg.scope === 'hard' ? 'chip-active' : ''}" data-action="test-scope" data-scope="hard">🔥 Từ hay sai (${S.items.filter(i => Store.isHard(i)).length})</button>
                <button class="chip ${cfg.scope === 'tag' ? 'chip-active' : ''}" data-action="test-scope" data-scope="tag">🏷️ Theo chủ đề</button>
                <button class="chip ${cfg.scope === 'all' ? 'chip-active' : ''}" data-action="test-scope" data-scope="all">🎲 Ngẫu nhiên toàn kho (${S.items.length})</button>
              </div>
              ${cfg.scope === 'tag' ? `
              <div class="flex flex-wrap gap-2 mt-3 pt-3 border-t border-slate-100 dark:border-slate-700/60">
                ${tags.length ? tags.map(t => `<button class="chip !min-h-[34px] text-xs ${cfg.tag === t.tag ? 'chip-active' : ''}" data-action="test-tag" data-tag="${U.esc(t.tag)}">#${U.esc(t.tag)} (${t.count})</button>`).join('') : '<span class="text-xs muted">Chưa có chủ đề nào.</span>'}
              </div>` : ''}
            </div>

            <div>
              <label class="label">2. Số lượng câu hỏi</label>
              <div class="flex flex-wrap gap-2">
                ${[5, 10, 20, 0].map(n => `<button class="chip ${Number(cfg.count) === n ? 'chip-active' : ''}" data-action="test-count" data-count="${n}">${n === 0 ? `Tất cả (${poolCount})` : `${n} câu`}</button>`).join('')}
              </div>
            </div>

            <div>
              <div class="flex items-center justify-between mb-1.5">
                <label class="label !mb-0">3. Dạng câu hỏi (chọn 1 hoặc trộn nhiều dạng)</label>
                <button class="text-xs text-indigo-600 dark:text-indigo-400 hover:underline" data-action="test-types-all">Chọn tất cả 4 dạng</button>
              </div>
              <div class="grid sm:grid-cols-2 gap-3">
                ${TEST_TYPES.map(tp => {
                  const on = (cfg.types || []).includes(tp.id);
                  return `<button type="button" class="option-card flex items-start gap-3 ${on ? 'option-card-active' : ''}" data-action="test-type" data-type="${tp.id}">
                    <span class="text-2xl leading-none mt-0.5">${tp.icon}</span>
                    <span class="flex-1">
                      <span class="flex items-center justify-between font-semibold">${tp.label}<span class="text-xs ${on ? 'text-indigo-600 dark:text-indigo-400' : 'muted'}">${on ? '✓ Đã chọn' : 'Chưa chọn'}</span></span>
                      <span class="block text-xs muted mt-0.5">${tp.desc}</span>
                    </span>
                  </button>`;
                }).join('')}
              </div>
            </div>

            <div class="pt-2 flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 dark:border-slate-700/60">
              <div class="text-sm muted">Sẵn sàng tạo đề từ <b>${poolCount}</b> từ phù hợp</div>
              <button class="btn btn-primary !min-h-[48px] px-6 text-base" data-action="test-start">${ic('play')}Bắt đầu làm bài</button>
            </div>
          </div>

          <div class="space-y-4">
            <div class="card p-5 space-y-3">
              <div class="section-title">🏆 Lịch sử bài Test gần đây</div>
              ${recentTests.length ? `<div class="divide-y divide-slate-100 dark:divide-slate-700/60 text-sm">
                ${recentTests.map(r => `
                  <div class="py-2.5 flex items-center justify-between gap-2">
                    <div>
                      <div class="font-semibold">${r.right}/${r.total} câu đúng <span class="badge ${r.score >= 80 ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300' : 'bg-amber-50 text-amber-700 dark:bg-amber-500/15 dark:text-amber-300'}">${r.score}%</span></div>
                      <div class="text-xs muted">${U.dateTime(r.at)} · ${U.duration(r.elapsed)}</div>
                    </div>
                  </div>`).join('')}
              </div>` : '<p class="text-sm muted">Chưa có bài kiểm tra nào. Hãy làm thử bài đầu tiên!</p>'}
            </div>

            <div class="card p-5 text-sm space-y-2">
              <div class="section-title">💡 Xử lý thông minh</div>
              <p class="muted leading-relaxed">• Khi kho mới có 1–3 từ, câu Trắc nghiệm tự động bổ sung đáp án nhiễu hợp lý.</p>
              <p class="muted leading-relaxed">• Khi từ chưa có câu ví dụ, câu Điền khuyết tự động chuyển sang hỏi <b>Nghĩa → Gõ từ</b>.</p>
            </div>
          </div>
        </div>
      </div>`;
  },
  renderRunning(t) {
    const q = this.currentQ();
    const total = t.questions.length;
    const pos = t.index + 1;
    const pct = Math.round(((pos - 1) / total) * 100);

    let body = '';
    if (q.type === 'mc') {
      const promptTitle = q.dir === 'w2m' ? 'Chọn nghĩa tiếng Việt đúng cho từ:' : 'Chọn từ tiếng Anh tương ứng với nghĩa:';
      const promptMain = q.dir === 'w2m' ? q.word : q.meaning;
      const target = q.dir === 'w2m' ? q.meaning : q.word;
      body = `
        <div class="space-y-5">
          <div class="text-center space-y-2 py-2">
            <div class="text-xs font-semibold uppercase tracking-wider muted">${promptTitle}</div>
            <div class="text-2xl md:text-4xl font-extrabold">${U.esc(promptMain)}</div>
            ${q.dir === 'w2m' ? `<div class="flex items-center justify-center gap-2">${posBadge(q.pos)}${q.ipa ? `<span class="muted ipa text-sm">${U.esc(q.ipa)}</span>` : ''}<button class="btn-icon !min-w-[36px] !min-h-[36px]" data-action="speak" data-text="${U.esc(q.word)}">🔊</button></div>` : ''}
          </div>
          <div class="grid sm:grid-cols-2 gap-3">
            ${q.options.map((opt, idx) => {
              let cls = '';
              if (q.answered) {
                const isTarget = U.answerNorm(opt) === U.answerNorm(target);
                const isPicked = U.answerNorm(opt) === U.answerNorm(q.userAnswer);
                if (isTarget) cls = '!border-emerald-500 !bg-emerald-50/70 dark:!bg-emerald-500/15';
                else if (isPicked) cls = '!border-rose-500 !bg-rose-50/70 dark:!bg-rose-500/15';
              }
              return `<button class="option-card flex items-center gap-3 ${cls}" data-action="test-pick-mc" data-val="${U.esc(opt)}" ${q.answered ? 'disabled' : ''}>
                <span class="kbd">${idx + 1}</span>
                <span class="font-medium text-base flex-1">${U.esc(opt)}</span>
              </button>`;
            }).join('')}
          </div>
        </div>`;
    } else if (q.type === 'cloze') {
      const masked = Text.maskHtml(q.sentence, q.word, '_______') || U.esc(q.sentence);
      body = `
        <div class="space-y-5">
          <div class="space-y-2">
            <div class="text-xs font-semibold uppercase tracking-wider muted">Điền từ đúng vào chỗ trống trong câu ví dụ:</div>
            <div class="rounded-2xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 p-4 md:p-5 text-lg md:text-xl leading-relaxed">${masked}</div>
            <div class="text-sm muted">💡 Nghĩa của từ cần điền: <b class="text-slate-800 dark:text-slate-100">${U.esc(q.meaning)}</b> ${posBadge(q.pos)} ${q.sentenceVi ? `· <i>"${U.esc(q.sentenceVi)}"</i>` : ''}</div>
          </div>
          <div class="space-y-2">
            <div class="text-xs muted">Chạm chọn nhanh hoặc tự gõ vào ô bên dưới:</div>
            <div class="flex flex-wrap gap-2">
              ${(q.bank || []).map(w => `<button type="button" class="chip" data-action="test-fill-bank" data-val="${U.esc(w)}" ${q.answered ? 'disabled' : ''}>${U.esc(w)}</button>`).join('')}
            </div>
          </div>
          <form data-test-form class="flex gap-2">
            <input data-test-input class="input !text-lg font-semibold" placeholder="Gõ từ tiếng Anh cần điền..." value="${U.esc(q.userAnswer)}" ${q.answered ? 'disabled' : ''} autocapitalize="off" spellcheck="false" />
            ${!q.answered ? `<button type="submit" class="btn btn-primary shrink-0">Kiểm tra</button>` : ''}
          </form>
        </div>`;
    } else if (q.type === 'dictation') {
      body = `
        <div class="space-y-5">
          <div class="text-center space-y-3 py-2">
            <button type="button" class="w-20 h-20 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white flex items-center justify-center mx-auto shadow-lg shadow-indigo-600/25 text-3xl" data-action="speak" data-text="${U.esc(q.word)}" title="Bấm để nghe phát âm">🔊</button>
            <div class="text-xs muted">Bấm vào loa để nghe lại phát âm chuẩn</div>
            <div class="text-lg font-bold text-indigo-600 dark:text-indigo-400">Nghĩa: ${U.esc(q.meaning)} ${posBadge(q.pos)}</div>
            <div class="inline-block rounded-xl bg-slate-100 dark:bg-slate-900/60 px-4 py-2 font-mono text-sm tracking-widest">${U.esc(q.hint)}</div>
          </div>
          <form data-test-form class="flex gap-2">
            <input data-test-input class="input !text-lg font-semibold text-center" placeholder="Gõ chính xác từ bạn nghe được..." value="${U.esc(q.userAnswer)}" ${q.answered ? 'disabled' : ''} autocapitalize="off" spellcheck="false" />
            ${!q.answered ? `<button type="submit" class="btn btn-primary shrink-0">Kiểm tra</button>` : ''}
          </form>
        </div>`;
    } else if (q.type === 'sentence') {
      body = `
        <div class="space-y-4">
          <div class="space-y-1">
            <div class="text-xs font-semibold uppercase tracking-wider muted">Thử thách vận dụng: Đặt 1 câu tiếng Anh có chứa từ sau</div>
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-2xl md:text-3xl font-extrabold text-indigo-600 dark:text-indigo-400">${U.esc(q.word)}</span>
              ${posBadge(q.pos)}
              ${q.ipa ? `<span class="muted ipa text-sm">${U.esc(q.ipa)}</span>` : ''}
              <button type="button" class="btn-icon !min-w-[36px] !min-h-[36px]" data-action="speak" data-text="${U.esc(q.word)}">🔊</button>
            </div>
            <div class="text-base font-medium">Nghĩa: ${U.esc(q.meaning)}</div>
          </div>
          <form data-test-form class="space-y-3">
            <textarea data-test-input class="input min-h-[96px]" rows="3" placeholder="Gõ một câu tiếng Anh của riêng bạn có sử dụng từ &quot;${U.esc(q.word)}&quot;..." ${q.answered ? 'disabled' : ''}>${U.esc(q.userAnswer)}</textarea>
            ${!q.answered ? `<div class="flex justify-end"><button type="submit" class="btn btn-primary">Chấm & Đối chiếu câu mẫu</button></div>` : ''}
          </form>
        </div>`;
    } else {
      body = `
        <div class="space-y-5">
          <div class="text-center space-y-2 py-2">
            <div class="text-xs font-semibold uppercase tracking-wider muted">Nhìn nghĩa tiếng Việt và gõ lại từ tiếng Anh:</div>
            <div class="text-2xl md:text-3xl font-extrabold">${U.esc(q.meaning)}</div>
            <div>${posBadge(q.pos)} <span class="font-mono text-xs muted ml-1">${U.esc(q.hint || '')}</span></div>
          </div>
          <form data-test-form class="flex gap-2">
            <input data-test-input class="input !text-lg font-semibold text-center" placeholder="Gõ từ tiếng Anh..." value="${U.esc(q.userAnswer)}" ${q.answered ? 'disabled' : ''} autocapitalize="off" spellcheck="false" />
            ${!q.answered ? `<button type="submit" class="btn btn-primary shrink-0">Kiểm tra</button>` : ''}
          </form>
        </div>`;
    }

    const feedbackBox = q.answered ? `
      <div class="rounded-2xl border p-4 space-y-2 ${q.correct ? 'border-emerald-300 bg-emerald-50/70 dark:border-emerald-500/40 dark:bg-emerald-500/10' : 'border-rose-300 bg-rose-50/70 dark:border-rose-500/40 dark:bg-rose-500/10'}">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="font-bold text-base ${q.correct ? 'text-emerald-700 dark:text-emerald-300' : 'text-rose-700 dark:text-rose-300'}">
            ${q.correct ? '✅ Chính xác! Từ này đã được cộng điểm thông thạo.' : '❌ Chưa chính xác — Từ này đã được đưa vào danh sách cần ôn lại.'}
          </div>
          <button class="btn-icon !min-w-[36px] !min-h-[36px]" data-action="speak" data-text="${U.esc(q.word)}" title="Nghe phát âm">🔊</button>
        </div>
        <div class="text-sm">Đáp án chuẩn: <b class="text-base">${U.esc(q.word)}</b> ${q.ipa ? `<span class="ipa muted">${U.esc(q.ipa)}</span>` : ''} — <span>${U.esc(q.meaning)}</span></div>
        ${q.nearMiss ? `<div class="text-xs text-amber-700 dark:text-amber-300">⚠️ Bạn chỉ gõ nhầm 1 ký tự ("${U.esc(q.userAnswer)}"). Hãy chú ý chính tả nhé!</div>` : ''}
        ${q.feedback ? `<div class="text-xs muted">${U.esc(q.feedback)}</div>` : ''}
        ${q.type === 'sentence' ? `
          <div class="pt-2 border-t border-slate-200/70 dark:border-slate-700/60 space-y-1.5 text-sm">
            <div class="text-xs font-semibold uppercase tracking-wider muted">Câu ví dụ gốc để đối chiếu:</div>
            ${(q.examples && q.examples.length) ? q.examples.map(e => `<div>• ${Text.highlight(e.en, q.word)} ${e.vi ? `<span class="muted">(${U.esc(e.vi)})</span>` : ''}</div>`).join('') : '<div class="muted text-xs">Từ này chưa có câu ví dụ gốc trong kho.</div>'}
            <div class="flex items-center gap-2 pt-1">
              <span class="text-xs muted">Tự đánh giá lại câu của bạn:</span>
              <button class="chip !min-h-[30px] text-xs ${q.correct ? 'chip-active' : ''}" data-action="test-self-grade" data-ok="1">Tính là Đúng</button>
              <button class="chip !min-h-[30px] text-xs ${!q.correct ? 'chip-active' : ''}" data-action="test-self-grade" data-ok="0">Tính là Cần ôn lại</button>
            </div>
          </div>` : ''}
        <div class="flex justify-end pt-1">
          <button class="btn btn-primary" data-action="test-next">${pos < total ? 'Câu tiếp theo →' : 'Xem kết quả bài Test 🏁'}</button>
        </div>
      </div>` : '';

    return `
      <div class="max-w-2xl mx-auto space-y-4">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <span class="badge bg-indigo-50 text-indigo-600 dark:bg-indigo-500/15 dark:text-indigo-300">Câu ${pos} / ${total}</span>
            <span class="badge bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300">${TYPE_LABEL[q.type] || q.type}</span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-sm font-mono muted">⏱ <span id="testClock">${U.clock(t.elapsed || 0)}</span></span>
            <button class="btn btn-ghost !min-h-[36px] px-2.5 text-xs" data-action="test-quit">Hủy bài</button>
          </div>
        </div>
        <div class="w-full h-1.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
          <div class="h-full bg-indigo-600 dark:bg-indigo-500 transition-all" style="width:${pct}%"></div>
        </div>

        <div class="card p-5 md:p-7 space-y-5">
          ${body}
          ${feedbackBox}
        </div>
      </div>`;
  },
  renderResult(t) {
    const wrongQs = t.questions.filter(q => !q.correct);
    const wrongIds = [...new Set(wrongQs.map(q => q.itemId))];
    return `
      <div class="max-w-3xl mx-auto space-y-6">
        <div class="card p-6 md:p-8 text-center space-y-5">
          <div class="text-5xl">${t.score >= 80 ? '🏆' : t.score >= 50 ? '👍' : '💪'}</div>
          <div>
            <div class="text-4xl font-extrabold text-indigo-600 dark:text-indigo-400">${t.score}%</div>
            <h3 class="text-xl font-bold mt-1"> Đúng ${t.right}/${t.questions.length} câu · Thời gian ${U.duration(t.elapsed || 0)}</h3>
            <p class="text-sm muted mt-1">Những từ làm đúng đã được tăng cấp SRS; những từ làm sai đã được đưa vào danh sách cần ôn lại ngay.</p>
          </div>
          <div class="flex flex-wrap justify-center gap-3">
            ${wrongIds.length ? `
              <button class="btn btn-primary" data-action="test-study-wrong">🔄 Học lại ${wrongIds.length} từ vừa sai (Flashcard)</button>
              <button class="btn btn-secondary" data-action="test-retest-wrong">📝 Kiểm tra lại các từ vừa sai</button>` : ''}
            <button class="btn btn-secondary" data-action="test-start">🎲 Làm đề mới</button>
            <button class="btn btn-ghost" data-action="test-setup">Đổi cấu hình đề</button>
          </div>
        </div>

        <div class="card overflow-hidden">
          <div class="p-4 md:px-6 border-b border-slate-100 dark:border-slate-700 font-semibold">Chi tiết từng câu hỏi</div>
          <div class="divide-y divide-slate-100 dark:divide-slate-700/60">
            ${t.questions.map((q, i) => `
              <div class="p-4 md:px-6 flex items-start justify-between gap-3">
                <div class="space-y-1 min-w-0 flex-1">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="badge ${q.correct ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300' : 'bg-rose-50 text-rose-600 dark:bg-rose-500/15 dark:text-rose-300'}">${q.correct ? '✓ Đúng' : '✗ Sai'}</span>
                    <span class="text-xs muted">Câu ${i + 1} · ${TYPE_LABEL[q.type]}</span>
                    <span class="font-bold">${U.esc(q.word)}</span>
                    <span class="text-sm muted">— ${U.esc(q.meaning)}</span>
                  </div>
                  <div class="text-xs muted">Bạn trả lời: <b class="${q.correct ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">${U.esc(q.userAnswer || '(Bỏ trống)')}</b></div>
                </div>

          </div>
        </div>

const Library = {
  filtered() {
    const f = S.session.library;
    const q = U.key(f.q);
    const endToday = U.endOfToday();
    let list = S.items.filter(it => {
      if (f.tag && !it.tags.includes(f.tag)) return false;
      if (f.level !== '' && f.level != null) {
        if (f.level === 'due') { if ((it.nextReview || 0) > endToday) return false; }
        else if (f.level === 'hard') { if (!Store.isHard(it)) return false; }
        else if (Number(it.level || 0) !== Number(f.level)) return false;
      }
      if (q) {
        const hay = [
          it.word, it.meaning, it.ipa, ...(it.tags || []),
          ...(it.examples || []).map(e => `${e.en} ${e.vi}`),
          ...Object.values(it.memory || {})
        ].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const s = f.sort || 'newest';
    if (s === 'newest') list.sort((a, b) => b.createdAt - a.createdAt);
    else if (s === 'oldest') list.sort((a, b) => a.createdAt - b.createdAt);
    else if (s === 'az') list.sort((a, b) => a.word.localeCompare(b.word));
    else if (s === 'za') list.sort((a, b) => b.word.localeCompare(a.word));
    else if (s === 'hardest') list.sort((a, b) => (b.wrong - b.correct * 0.3) - (a.wrong - a.correct * 0.3) || b.wrong - a.wrong);

/* =====================================================================
   17. SAO LƯU (EXPORT / IMPORT JSON & CSV) & ĐỒNG BỘ ĐÁM MÂY (CLOUD SYNC)
   ===================================================================== */
const Backup = {
  buildPayload() {
    return {
      app: APP_KEY,
      version: 1,
      exportedAt: Date.now(),
      vocab_items: S.items,
      study_stats: S.stats,
      app_settings: Object.assign({}, S.settings, {
        cloud: Object.assign({}, S.settings.cloud, { gistToken: '', firebaseAuth: '' })
      }),
      tombstones: S.tombstones
    };
  },
  exportJSON() {
    const filename = `vocab-backup-${U.dateKey()}.json`;
    U.download(filename, JSON.stringify(this.buildPayload(), null, 2), 'application/json');
    S.settings.wordsSinceBackup = 0;
    S.settings.lastBackupAt = Date.now();
    Store.saveSettings();
    renderBackupReminder();
    Toast.show(`📥 Đã tải file sao lưu <b>${filename}</b> (${S.items.length} từ)`, 'success', 4000);
    if (S.session.view === 'settings') Settings.render();
  },
  exportCSV() {
    const escCsv = val => `"${String(val == null ? '' : val).replace(/"/g, '""')}"`;
    const header = ['Word', 'POS', 'IPA', 'Meaning', 'Examples', 'Mnemonic', 'Collocations', 'Personal', 'Roots', 'Tags', 'Level'];
    const rows = S.items.map(i => [
      i.word, i.pos, i.ipa, i.meaning,
      (i.examples || []).map(e => e.vi ? `${e.en} // ${e.vi}` : e.en).join(' ;; '),
      i.memory.mnemonic, i.memory.collocations, i.memory.personal, i.memory.roots,
      (i.tags || []).join(', '), i.level
    ].map(escCsv).join(','));
    const csv = '\uFEFF' + [header.join(','), ...rows].join('\r\n');
    const filename = `vocab-export-${U.dateKey()}.csv`;
    U.download(filename, csv, 'text/csv');
    Toast.show(`📊 Đã xuất file <b>${filename}</b> mở được ngay bằng Excel / Google Sheets.`, 'success');
  },
  triggerImport() {
    const inp = document.getElementById('fileImport');
    if (inp) { inp.value = ''; inp.click(); }
  },
  async handleFile(file) {
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const rawItems = Array.isArray(parsed) ? parsed : (parsed.vocab_items || parsed.items || []);
      if (!Array.isArray(rawItems)) throw new Error('Cấu trúc file JSON không hợp lệ.');
      const incoming = rawItems.map(sanitizeItem).filter(i => i.word && i.meaning);
      if (!incoming.length && !parsed.study_stats) {
        Toast.show('File sao lưu không có từ vựng nào hợp lệ.', 'warn');
        return;
      }
      const mode = S.items.length ? await Modal.choice({
        title: `Khôi phục dữ liệu (${incoming.length} từ trong file)`,
        message: 'Chọn cách nhập dữ liệu vào kho hiện tại của bạn:',
        options: [
          { value: 'merge', icon: '🔀', label: 'Gộp thông minh vào kho hiện tại (Khuyên dùng)', desc: 'Giữ toàn bộ từ cũ, cập nhật từ trùng theo phiên bản mới nhất và thêm các từ mới.' },
          { value: 'overwrite', icon: '⚠️', label: 'Ghi đè toàn bộ', desc: 'Thay thế hoàn toàn kho từ hiện tại bằng dữ liệu trong file sao lưu.', danger: true }
        ]
      }) : 'overwrite';
      if (!mode) return;

      if (mode === 'overwrite') {
        S.items = incoming;
        if (parsed.study_stats) S.stats = U.deepMerge(DEFAULT_STATS, parsed.study_stats);
        if (parsed.tombstones) S.tombstones = parsed.tombstones;
      } else {
        this.mergeAll(parsed, incoming);
      }
      S.stats.streak = computeStreak();
      Store.saveItems();
      Store.saveStats();
      Store.saveTomb();
      renderNav();
      render();
      Toast.show(`✅ Đã khôi phục dữ liệu thành công! Kho hiện có ${S.items.length} từ.`, 'success', 4000);
    } catch (e) {
      console.error(e);
      Toast.show(`❌ Không đọc được file sao lưu: ${U.esc(e.message || 'Định dạng JSON lỗi')}`, 'error', 4500);
    }
  },
  mergeAll(remotePayload, incomingItems = null) {
    const inc = incomingItems || (remotePayload.vocab_items || []).map(sanitizeItem).filter(i => i.word && i.meaning);
    const tomb = Object.assign({}, S.tombstones, remotePayload.tombstones || {});
    S.tombstones = tomb;

    const byId = new Map();
    S.items.forEach(i => { if (!tomb[i.id] || i.updatedAt > tomb[i.id]) byId.set(i.id, i); });
    inc.forEach(r => {
      if (tomb[r.id] && tomb[r.id] >= (r.updatedAt || 0)) return;
      const curId = byId.get(r.id);
      if (curId) {
        if ((r.updatedAt || 0) > (curId.updatedAt || 0)) byId.set(r.id, r);
        return;
      }
      const dupWord = [...byId.values()].find(x => U.key(x.word) === U.key(r.word));
      if (dupWord) {
        Store.mergeInto(dupWord, r);
        dupWord.level = Math.max(dupWord.level || 0, r.level || 0);
        dupWord.correct = Math.max(dupWord.correct || 0, r.correct || 0);
        dupWord.wrong = Math.max(dupWord.wrong || 0, r.wrong || 0);
      } else {
        byId.set(r.id, r);
      }
    });
    S.items = [...byId.values()].sort((a, b) => b.createdAt - a.createdAt);

    if (remotePayload.study_stats) {
      const rs = remotePayload.study_stats;
      const dh = Object.assign({}, S.stats.dailyHistory || {});
      Object.entries(rs.dailyHistory || {}).forEach(([k, v]) => { dh[k] = Math.max(dh[k] || 0, Number(v) || 0); });
      S.stats.dailyHistory = dh;
      S.stats.totalReviews = Math.max(S.stats.totalReviews || 0, rs.totalReviews || 0);
      const seenTests = new Map();
      [...(S.stats.testResults || []), ...(rs.testResults || [])].forEach(tr => { if (tr && tr.id) seenTests.set(tr.id, tr); });
      S.stats.testResults = [...seenTests.values()].sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 40);
      S.stats.streak = computeStreak();
    }
  }
};

const Cloud = {
  busy: false,
  suppress: false,
  lastPullAt: 0,
  syncStatus: 'idle',
  lastError: '',

  configured() {
    const c = S.settings.cloud || {};
    if (c.provider === 'gist') return !!U.norm(c.gistToken);
    if (c.provider === 'firebase') return !!U.norm(c.firebaseUrl);
    return false;
  },

  firebaseEndpoint() {
    const c = S.settings.cloud || {};
    let url = U.norm(c.firebaseUrl).replace(/\/+$/, '');
    if (url.includes('console.firebase.google.com')) {
      const dbMatch = url.match(/\/database\/([^\/]+)/);
      const projMatch = url.match(/\/project\/([^\/]+)/);
      const name = (dbMatch && dbMatch[1]) || (projMatch && `${projMatch[1]}-default-rtdb`) || '';
      if (name) {
        url = `https://${name}.firebaseio.com`;
      }
    }
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    if (!url.endsWith('.json')) url += '/vocab_app_db_v1.json';
    if (U.norm(c.firebaseAuth)) url += (url.includes('?') ? '&' : '?') + 'auth=' + encodeURIComponent(U.norm(c.firebaseAuth));
    return url;
  },

  generateSyncCode() {
    const c = S.settings.cloud || {};
    if (!this.configured()) return '';
    const obj = { p: c.provider };
    if (c.provider === 'gist') {
      obj.t = c.gistToken || '';
      obj.g = c.gistId || '';
    } else if (c.provider === 'firebase') {
      obj.u = c.firebaseUrl || '';
      obj.a = c.firebaseAuth || '';
    }
    try {
      return 'VCSYNC:' + btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
    } catch (e) {
      return 'VCSYNC:' + btoa(JSON.stringify(obj));
    }
  },

  importSyncCode(raw) {
    if (!raw) return false;
    let str = String(raw).trim();
    if (str.startsWith('VCSYNC:')) str = str.slice(7);
    try {
      let json = '';
      try {
        json = decodeURIComponent(escape(atob(str)));
      } catch (e) {
        json = atob(str);
      }
      const data = JSON.parse(json);
      if (!data || !data.p) return false;
      if (data.p === 'gist') {
        S.settings.cloud.provider = 'gist';
        S.settings.cloud.gistToken = data.t || '';
        S.settings.cloud.gistId = data.g || '';
        S.settings.cloud.autoSync = true;
      } else if (data.p === 'firebase') {
        S.settings.cloud.provider = 'firebase';
        S.settings.cloud.firebaseUrl = data.u || '';
        S.settings.cloud.firebaseAuth = data.a || '';
        S.settings.cloud.autoSync = true;
      } else {
        return false;
      }
      Store.saveSettings();
      renderNav();
      return true;
    } catch (e) {
      console.warn('[importSyncCode]', e);
      return false;
    }

  cleanGistId(val) {
    let s = U.norm(val);
    if (!s) return '';
    const m = s.match(/gist\.github\.com\/(?:[^\/]+\/)?([a-f0-9]+)/i);
    return m ? m[1] : s.replace(/[^a-f0-9]/gi, '');
  },

  async pullGist() {
    const c = S.settings.cloud;
    const headers = { Accept: 'application/vnd.github+json', Authorization: `Bearer ${U.norm(c.gistToken)}` };
    let gistId = this.cleanGistId(c.gistId);
    if (!gistId) {
      const r = await fetch('https://api.github.com/gists?per_page=50', { headers });
      if (!r.ok) throw new Error(`GitHub API (${r.status})`);
      const list = await r.json();
      const found = Array.isArray(list) ? list.find(g => g.files && g.files[SYNC_FILE]) : null;
      if (found) { gistId = found.id; c.gistId = gistId; Store.saveSettings(); }
    }
    if (!gistId) return null;
    const res = await fetch(`https://api.github.com/gists/${gistId}`, { headers });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(`GitHub Gist (${res.status})`);
    const gist = await res.json();
    const file = gist.files && (gist.files[SYNC_FILE] || Object.values(gist.files)[0]);
    return file && file.content ? JSON.parse(file.content) : null;
  },
  async pushGist(payload) {
    const c = S.settings.cloud;
    const headers = { Accept: 'application/vnd.github+json', Authorization: `Bearer ${U.norm(c.gistToken)}`, 'Content-Type': 'application/json' };
    const body = JSON.stringify({
      description: 'VocabNest Personal Vocabulary Cloud Sync',
      public: false,
      files: { [SYNC_FILE]: { content: JSON.stringify(payload) } }
    });
    const gistId = this.cleanGistId(c.gistId);
    const url = gistId ? `https://api.github.com/gists/${gistId}` : 'https://api.github.com/gists';
    const method = gistId ? 'PATCH' : 'POST';
    const res = await fetch(url, { method, headers, body });
    if (!res.ok) throw new Error(`Không đẩy được lên GitHub Gist (${res.status})`);
    const data = await res.json();
    if (data && data.id) { c.gistId = data.id; Store.saveSettings(); }
  },
  async pullFirebase() {
    const res = await fetch(this.firebaseEndpoint());
    if (!res.ok) throw new Error(`Firebase (${res.status})`);
    return await res.json();
  },
  async pushFirebase(payload) {
    const res = await fetch(this.firebaseEndpoint(), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(`Firebase PUT (${res.status})`);
  },
  async triggerAutoPull(force = false) {
    if (!this.configured() || !S.settings.cloud.autoSync || !navigator.onLine) return;
    if (this.busy || this.suppress) return;
    const now = Date.now();
    if (!force && now - this.lastPullAt < 15000) return;
    this.lastPullAt = now;

    this.busy = true;
    updateStorageUI();
    try {
      const p = S.settings.cloud.provider;
      const remote = p === 'gist' ? await this.pullGist() : await this.pullFirebase();
      if (remote && (remote.vocab_items || remote.study_stats)) {
        const prevCount = S.items.length;
        Backup.mergeAll(remote);
        S.settings.cloud.lastSyncAt = Date.now();
        Store.saveItems();
        Store.saveStats();
        Store.saveTomb();
        Store.saveSettings();
        renderNav();
        if (S.items.length !== prevCount || ['dashboard', 'library', 'settings'].includes(S.session.view)) {
          render();
        }
      }
    } catch (e) {
      console.warn('[Cloud.triggerAutoPull]', e);
    } finally {
      this.busy = false;
      this.suppress = false;
      updateStorageUI();
    }
  },
  async sync({ silent = false } = {}) {
    if (!this.configured()) {
      if (!silent) { go('settings'); Toast.show('Hãy cấu hình Firebase hoặc GitHub Gist trước khi đồng bộ.', 'info'); }
      return;
    }
    if (this.busy) return;
    this.busy = true;
    this.suppress = true;
    this.lastPullAt = Date.now();
    updateStorageUI();
    if (!silent) Toast.show('☁️ Đang đồng bộ dữ liệu với Cloud...', 'info', 1800);
    try {
      const p = S.settings.cloud.provider;
      const remote = p === 'gist' ? await this.pullGist() : await this.pullFirebase();
      if (remote && (remote.vocab_items || remote.study_stats)) {
        Backup.mergeAll(remote);
      }
      const merged = Backup.buildPayload();
      if (p === 'gist') await this.pushGist(merged);
      else await this.pushFirebase(merged);

      S.settings.cloud.lastSyncAt = Date.now();
      Store.saveItems();
      Store.saveStats();
      Store.saveTomb();
      Store.saveSettings();
      renderNav();
      if (['settings', 'dashboard', 'library'].includes(S.session.view)) render();
      if (!silent) Toast.show(`☁️ Đồng bộ Cloud thành công (${S.items.length} từ)!`, 'success');
    } catch (e) {
      console.warn('[Cloud.sync]', e);
      if (!silent) Toast.show(`❌ Lỗi đồng bộ Cloud: ${U.esc(e.message)}`, 'error', 4500);
    } finally {
      this.busy = false;
      this.suppress = false;
      updateStorageUI();
    }
  }
};

const NAV_ITEMS = [
  { id: 'dashboard', label: 'Dashboard', title: 'Tổng quan & Tiến độ', icon: 'layout-dashboard' },
  { id: 'add', label: 'Thêm từ', title: 'Thêm từ vựng', icon: 'plus-circle' },

];

function renderNav() {
  const cur = S.session.view || 'dashboard';
  const side = document.getElementById('sideNav');
  const bottom = document.getElementById('bottomNav');
  const titleEl = document.getElementById('pageTitle');
  const activeItem = NAV_ITEMS.find(n => n.id === cur) || NAV_ITEMS[0];
  if (titleEl) titleEl.textContent = activeItem.title;

  if (side) {
    side.innerHTML = NAV_ITEMS.map(n => {
      const b = n.badge ? n.badge() : 0;
      return `<button class="nav-link ${cur === n.id ? 'nav-link-active' : ''}" data-action="go" data-view="${n.id}">
        ${ic(n.icon, 'w-5 h-5 shrink-0')}
        <span class="flex-1 text-left">${n.label}</span>
        ${b > 0 ? `<span class="badge ${cur === n.id ? 'bg-indigo-600 text-white dark:bg-indigo-400 dark:text-slate-950' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'}">${b}</span>` : ''}
      </button>`;
    }).join('') + (Cloud.configured() ? `
      <div class="pt-2 mt-2 border-t border-slate-100 dark:border-slate-800 space-y-1">
        <button class="nav-link text-indigo-600 dark:text-indigo-400" data-action="cloud-sync">${ic('cloud', 'w-5 h-5')}<span>☁️ Đồng bộ Cloud</span></button>
        <button class="nav-link text-slate-500 hover:text-rose-600 dark:text-slate-400 dark:hover:text-rose-400" data-action="school-logout" title="Lưu lên Cloud và xóa sạch tài khoản trên máy tính này">${ic('log-out', 'w-5 h-5')}<span>🚪 Rời máy ở trường</span></button>
      </div>` : '');
  }

  if (bottom) {
    const mobileItems = NAV_ITEMS.filter(n => !n.desktopOnly);
    bottom.innerHTML = `<div class="grid grid-cols-5 h-16">
      ${mobileItems.map(n => {
        const active = cur === n.id;
        const b = n.badge ? n.badge() : 0;
        return `<button class="relative flex flex-col items-center justify-center gap-0.5 min-h-[44px] ${active ? 'text-indigo-600 dark:text-indigo-400 font-semibold' : 'text-slate-500 dark:text-slate-400'}" data-action="go" data-view="${n.id}">
          ${ic(n.icon, 'w-5 h-5')}
          <span class="text-[11px] leading-tight">${n.label}</span>
          ${n.id === 'study' && b > 0 ? `<span class="absolute top-1.5 right-3 min-w-[16px] h-4 px-1 rounded-full bg-indigo-600 text-white text-[10px] font-bold flex items-center justify-center">${b > 99 ? '99+' : b}</span>` : ''}
        </button>`;
      }).join('')}
    </div>`;
  }

  updateStorageUI();
  updateThemeButtons();
  lucide.createIcons();
}

function updateStorageUI(pulse = false) {
  const count = S.items.length;
  const t = StorageManager.lastSavedAt ? U.time(StorageManager.lastSavedAt) : U.time();
  const badge = document.getElementById('storageBadge');
  const configured = Cloud.configured();

  if (badge) {
    const span = badge.querySelector('[data-badge-text]');
    const dot = badge.querySelector('.status-dot');

    if (Cloud.busy) {
      if (span) span.innerHTML = `<span class="inline-block animate-spin mr-1">🔄</span>Đang đồng bộ...`;
      badge.className = 'inline-flex items-center gap-1.5 min-h-[36px] px-3 rounded-full border border-indigo-300 bg-indigo-50 text-indigo-700 dark:border-indigo-500/40 dark:bg-indigo-500/15 dark:text-indigo-300 text-xs font-medium transition-colors cursor-pointer';
      badge.title = 'Đang đẩy/kéo dữ liệu mới nhất với Cloud...';
    } else if (configured) {
      const syncT = S.settings.cloud.lastSyncAt ? U.shortTime(S.settings.cloud.lastSyncAt) : null;
      if (span) span.textContent = `☁️ Đã đồng bộ (${count} từ)`;
      badge.className = 'inline-flex items-center gap-2 min-h-[36px] px-3 rounded-full border border-indigo-200 bg-indigo-50 text-indigo-700 dark:border-indigo-500/30 dark:bg-indigo-500/10 dark:text-indigo-300 text-xs font-medium transition-colors cursor-pointer';
      badge.title = `Cloud Sync đang bật · Đã đồng bộ lúc ${syncT || t} · Bấm để đồng bộ ngay / kết nối điện thoại`;
      if (dot) dot.className = 'status-dot w-2 h-2 rounded-full bg-indigo-500';
    } else {
      if (span) span.textContent = `🟢 Đã lưu máy (${count} từ)`;
      badge.className = 'inline-flex items-center gap-2 min-h-[36px] px-3 rounded-full border border-emerald-200 bg-emerald-50 text-emerald-700 dark:border-emerald-500/30 dark:bg-emerald-500/10 dark:text-emerald-300 text-xs font-medium transition-colors cursor-pointer';
      badge.title = `Cập nhật lúc ${t} · Lưu kép localStorage + IndexedDB · Bấm để xem hướng dẫn đồng bộ đám mây`;
      if (dot) dot.className = 'status-dot w-2 h-2 rounded-full bg-emerald-500';
    }
    if (pulse) { badge.classList.remove('saved-pulse'); void badge.offsetWidth; badge.classList.add('saved-pulse'); }
  }

  const sub = document.querySelector('[data-storage-sub]');
  const title = document.querySelector('[data-storage-title]');
  if (title) {
    if (Cloud.busy) title.textContent = 'Đang đồng bộ Cloud...';
    else if (configured) title.textContent = 'Cloud Sync hoạt động';
    else title.textContent = 'Đã lưu vào thiết bị';
  }
  if (sub) {
    if (configured) {
      const syncT = S.settings.cloud.lastSyncAt ? U.shortTime(S.settings.cloud.lastSyncAt) : U.shortTime();
      sub.textContent = `${count} từ · ☁️ Cloud: ${syncT}`;
    } else {
      sub.textContent = `${count} từ · Lưu lúc ${t}`;
    }
  }
}

function renderBackupReminder() {
  const box = document.getElementById('backupReminder');
  if (!box) return;
  const since = S.settings.wordsSinceBackup || 0;
  const promptAt = S.settings.nextBackupPrompt || 20;
  if (since < promptAt) { box.innerHTML = ''; return; }
  box.innerHTML = `
    <div class="max-w-6xl mx-auto px-4 md:px-8 pt-4">
      <div class="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-emerald-300 bg-emerald-50/90 dark:border-emerald-500/40 dark:bg-emerald-500/10 px-4 py-3 text-sm">
        <div class="flex items-center gap-2.5 text-emerald-900 dark:text-emerald-200">
          <span>💾</span>
          <span>Bạn đã thêm <b>${since} từ mới</b> kể từ lần sao lưu trước. Tải bản sao lưu về máy chỉ với 1 chạm để an toàn tuyệt đối!</span>
        </div>
        <div class="flex items-center gap-2">
          <button class="btn btn-primary !min-h-[36px] px-3 text-xs" data-action="export-json">📥 Tải file Backup ngay</button>
          <button class="btn btn-ghost !min-h-[36px] px-2.5 text-xs" data-action="dismiss-backup-reminder">Để sau</button>
        </div>
      </div>
    </div>`;
}

function applyTheme(theme) {
  const t = theme || S.settings.theme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  S.settings.theme = t;
  document.documentElement.classList.toggle('dark', t === 'dark');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#0F172A' : '#F8FAFC');
  updateThemeButtons();
}

function toggleTheme() {
  const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
  applyTheme(next);
  Store.saveSettings();
  if (S.session.view === 'settings') Settings.render();
  lucide.createIcons();
}

function updateThemeButtons() {
  const isDark = document.documentElement.classList.contains('dark');
  document.querySelectorAll('[data-theme-icon]').forEach(el => {
    el.innerHTML = ic(isDark ? 'sun' : 'moon', 'w-4 h-4');
  });
  document.querySelectorAll('[data-theme-label]').forEach(el => {
    el.textContent = isDark ? 'Chế độ Sáng' : 'Chế độ Tối';
  });
}

    size: 'md',
    body: `

          <div class="font-semibold text-indigo-600 dark:text-indigo-400">Toàn cục (Mọi màn hình)</div>

          <div class="flex justify-between py-1 border-b border-slate-100 dark:border-slate-700/60"><span>Tìm kiếm nhanh trong Kho từ</span><span><span class="kbd">/</span></span></div>
          <div class="flex justify-between py-1 border-b border-slate-100 dark:border-slate-700/60"><span>Mở bảng phím tắt này</span><span><span class="kbd">?</span></span></div>

          <div class="flex justify-between py-1 border-b border-slate-100 dark:border-slate-700/60"><span>Mở / ẩn gợi ý (Hint)</span><span><span class="kbd">H</span></span></div>
          <div class="flex justify-between py-1 border-b border-slate-100 dark:border-slate-700/60"><span>Phát âm từ vựng</span><span><span class="kbd">S</span></span></div>
          <div class="flex justify-between py-1 border-b border-slate-100 dark:border-slate-700/60"><span>Phát âm câu ví dụ</span><span><span class="kbd">E</span></span></div>
          <div class="flex justify-between py-1"><span>Đánh giá: Quên / Khó / Nhớ / Rất dễ</span><span><span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">3</span> <span class="kbd">4</span></span></div>

function go(view, extra = {}) {
  ActiveForms.forEach(f => { try { f.flush(); } catch (e) { /* bỏ qua */ } });
  ActiveForms.clear();
  if (S.session.view === 'test' && view !== 'test') Test.syncElapsed();
  S.session.view = view;
  if (extra.tab) S.session.addTab = extra.tab;
  Store.saveSession();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render() {
  renderNav();
  renderBackupReminder();
  const v = document.getElementById('view');
  if (!v) return;
  const cur = S.session.view || 'dashboard';
  if (cur === 'dashboard') Dashboard.render();
  else if (cur === 'add') AddView.render();
  else if (cur === 'study') Study.render();
  else if (cur === 'test') Test.render();
  else if (cur === 'library') Library.render();
  else if (cur === 'settings') Settings.render();
  else Dashboard.render();
  lucide.createIcons();
}

/* ---------- Xử lý sự kiện toàn cục ---------- */
function bindEvents() {
  document.addEventListener('click', async e => {
    const noFlip = e.target.closest('[data-no-flip]');
    const el = e.target.closest('[data-action]');
    if (!el) return;
    if (el.dataset.action === 'fc-flip' && noFlip) return;

    const act = el.dataset.action;
    if (act === 'go') { go(el.dataset.view, { tab: el.dataset.tab }); }
    else if (act === 'toggle-theme') { toggleTheme(); }
    else if (act === 'set-theme') { applyTheme(el.dataset.theme); Store.saveSettings(); Settings.render(); lucide.createIcons(); }
    else if (act === 'set-voice') { S.settings.voice = el.dataset.voice; Store.saveSettings(); Speech.speak('Hello'); Settings.render(); lucide.createIcons(); }
    else if (act === 'save-goal-inline') {
      const inp = document.getElementById('goalInput');
      if (inp) { S.settings.dailyGoal = Math.min(500, Math.max(1, parseInt(inp.value, 10) || 15)); Store.saveSettings(); Toast.show(`🎯 Đã lưu mục tiêu ${S.settings.dailyGoal} từ/ngày`, 'success'); }
    }
    else if (act === 'shortcuts') { showShortcutsModal(); }
    else if (act === 'quick-add') { quickAdd(); lucide.createIcons(); }
    else if (act === 'add-tab') { S.session.addTab = el.dataset.tab; Store.saveSession(); AddView.render(); lucide.createIcons(); }
    else if (act === 'bulk-sample') {
      const ta = document.getElementById('bulkText');
      if (ta) { ta.value = Bulk.sample; S.bulkDraft.text = ta.value; StorageManager.save('bulk_draft', S.bulkDraft); AddView.renderBulkPreview(); }
    }
    else if (act === 'bulk-clear') {
      const ta = document.getElementById('bulkText');
      if (ta) { ta.value = ''; S.bulkDraft.text = ''; StorageManager.save('bulk_draft', S.bulkDraft); AddView.renderBulkPreview(); }
    }
    else if (act === 'bulk-save') { AddView.saveBulk(); lucide.createIcons(); }
    else if (act === 'speak') { Speech.speak(el.dataset.text); }
    else if (act === 'edit' || act === 'fc-edit') { openEdit(el.dataset.id); lucide.createIcons(); }
    else if (act === 'delete') { await deleteWord(el.dataset.id); lucide.createIcons(); }
    else if (act === 'load-samples') { Sample.load(); }
    else if (act === 'remove-samples') { Sample.remove(); }
    else if (act === 'edit-goal') { Dashboard.editGoal(); lucide.createIcons(); }
    else if (act === 'start-due') {
      S.session.studyConfig.filter = 'due';
      Study.startFromConfig();
    }
    else if (act === 'study-tag') {
      S.session.studyConfig.filter = 'tag';
      S.session.studyConfig.tag = el.dataset.tag;
      Study.startFromConfig();
    }
    else if (act === 'filter-level') {
      S.session.library.level = el.dataset.level;
      go('library');
    }
    /* Flashcard actions */
    else if (act === 'study-filter') {
      S.session.studyConfig.filter = el.dataset.filter;
      if (el.dataset.filter === 'tag' && !S.session.studyConfig.tag && Store.tags()[0]) S.session.studyConfig.tag = Store.tags()[0].tag;
      Study.startFromConfig();
    }
    else if (act === 'study-pick-tag') {
      S.session.studyConfig.tag = el.dataset.tag;
      Study.startFromConfig();
    }
    else if (act === 'study-start') { Study.startFromConfig(); }
    else if (act === 'fc-flip') { Study.flip(); }
    else if (act === 'fc-hint') { Study.toggleHint(); }
    else if (act === 'fc-speak-word') { Study.speakWord(); }
    else if (act === 'fc-speak-ex') { Study.speakExample(Number(el.dataset.idx || 0)); }
    else if (act === 'fc-grade') { Study.grade(Number(el.dataset.grade)); lucide.createIcons(); }
    else if (act === 'fc-prev') { Study.prevCard(); lucide.createIcons(); }
    else if (act === 'fc-exit') { Study.exitSession(); lucide.createIcons(); }
    else if (act === 'fc-retry-wrong') {
      const ids = (S.session.flashcard && S.session.flashcard.wrongIds) || [];
      Study.startWithIds(ids, 'Ôn lại các từ vừa quên');
    }
    /* Test actions */
    else if (act === 'test-scope') {
      S.session.testConfig.scope = el.dataset.scope;
      if (el.dataset.scope === 'tag' && !S.session.testConfig.tag && Store.tags()[0]) S.session.testConfig.tag = Store.tags()[0].tag;
      Store.saveSession(); Test.render(); lucide.createIcons();
    }
    else if (act === 'test-tag') { S.session.testConfig.tag = el.dataset.tag; Store.saveSession(); Test.render(); lucide.createIcons(); }
    else if (act === 'test-count') { S.session.testConfig.count = Number(el.dataset.count); Store.saveSession(); Test.render(); lucide.createIcons(); }
    else if (act === 'test-type') {
      const tp = el.dataset.type;
      const cur = new Set(S.session.testConfig.types || []);
      if (cur.has(tp)) { if (cur.size > 1) cur.delete(tp); else Toast.show('Cần chọn ít nhất 1 dạng câu hỏi.', 'info'); }
      else cur.add(tp);
      S.session.testConfig.types = [...cur];
      Store.saveSession(); Test.render(); lucide.createIcons();
    }
    else if (act === 'test-types-all') {
      S.session.testConfig.types = TEST_TYPES.map(t => t.id);
      Store.saveSession(); Test.render(); lucide.createIcons();
    }
    else if (act === 'test-start') { Test.start(); lucide.createIcons(); }
    else if (act === 'test-pick-mc') { Test.checkAnswer(el.dataset.val); lucide.createIcons(); }
    else if (act === 'test-fill-bank') {
      const inp = document.querySelector('[data-test-input]');
      if (inp) inp.value = el.dataset.val;
      Test.checkAnswer(el.dataset.val);
      lucide.createIcons();
    }
    else if (act === 'test-self-grade') { Test.overrideSentenceGrade(el.dataset.ok === '1'); lucide.createIcons(); }
    else if (act === 'test-next') { Test.next(); lucide.createIcons(); }
    else if (act === 'test-quit' || act === 'test-setup') { Test.resetToSetup(); lucide.createIcons(); }
    else if (act === 'test-study-wrong') {
      const t = S.session.test;
      const ids = t ? [...new Set(t.questions.filter(q => !q.correct).map(q => q.itemId))] : [];
      Study.startWithIds(ids, 'Học lại các từ vừa làm sai');
    }
    else if (act === 'test-retest-wrong') {
      const t = S.session.test;
      const items = t ? [...new Set(t.questions.filter(q => !q.correct).map(q => q.itemId))].map(id => Store.get(id)).filter(Boolean) : [];
      Test.start(items);
      lucide.createIcons();
    }
    /* Library actions */
    else if (act === 'lib-mode') { S.session.library.mode = el.dataset.mode; Store.saveSession(); Library.render(); lucide.createIcons(); }
    else if (act === 'lib-tag') { S.session.library.tag = el.dataset.tag; Store.saveSession(); Library.render(); lucide.createIcons(); }
    else if (act === 'lib-reset') { S.session.library = Object.assign({}, DEFAULT_SESSION.library, { mode: S.session.library.mode }); Store.saveSession(); Library.render(); lucide.createIcons(); }
    else if (act === 'lib-study-filtered') {
      const ids = Library.filtered().map(i => i.id);
      Study.startWithIds(ids, 'Phiên học theo bộ lọc Kho từ');
    }
    else if (act === 'lib-test-filtered') {
      const list = Library.filtered();
      Test.start(list);
      lucide.createIcons();
    }
    /* Backup & Cloud actions */
    else if (act === 'export-json') { Backup.exportJSON(); }
    else if (act === 'export-csv') { Backup.exportCSV(); }
    else if (act === 'import-json') { Backup.triggerImport(); }
    else if (act === 'dismiss-backup-reminder') {
      S.settings.nextBackupPrompt = (S.settings.wordsSinceBackup || 0) + 20;
      Store.saveSettings();
      renderBackupReminder();
    }
    else if (act === 'cloud-provider') {
      S.settings.cloud.provider = el.dataset.provider;
      Store.saveSettings();
      Settings.render();
      renderNav();
    }
    else if (act === 'cloud-save-and-sync') {
      Settings.saveCloudForm(document.getElementById('cloudForm'));
      Cloud.sync();
    }
    else if (act === 'cloud-sync') { Cloud.sync(); }
    else if (act === 'cloud-guide') { Cloud.showGuideModal(el.dataset.tab || 'firebase'); }
    else if (act === 'cloud-pair') { Cloud.showPairingModal(); }
    else if (act === 'cloud-import-code') { Cloud.showInputCodeModal(); }
    else if (act === 'copy-sync-code') {
      const code = Cloud.generateSyncCode();
      U.copyText(code).then(ok => {
        if (ok) Toast.show('📋 Đã sao chép Mã kết nối vào bộ nhớ tạm!', 'success');
        else Toast.show('Vui lòng bôi đen mã và nhấn Ctrl+C', 'warn');
      });
    }
    else if (act === 'copy-sync-link') {
      const code = Cloud.generateSyncCode();
      const isHttp = /^https?:\/\//i.test(window.location.href);
      const url = isHttp ? (window.location.href.split('#')[0] + '#sync=' + encodeURIComponent(code)) : code;
      U.copyText(url).then(ok => {
        if (ok) Toast.show('🔗 Đã sao chép Đường link kết nối 1 chạm!', 'success');
        else Toast.show('Không thể tự động chép link', 'warn');
      });
    }
    else if (act === 'copy-school-link') {
      const code = Cloud.generateSyncCode();
      const isHttp = /^https?:\/\//i.test(window.location.href);
      const base = isHttp ? window.location.href.split('#')[0] : 'https://namvibecoding.github.io/tu-vung';
      const url = `${base}#sync=${encodeURIComponent(code)}`;
      U.copyText(url).then(ok => {
        if (ok) Toast.show('🔗 Đã copy Link 1 chạm! Hãy lưu vào Zalo Truyền File để click mở khi ở trường.', 'success', 4500);
        else Toast.show('Không thể tự động chép link', 'warn');
      });
    }
    else if (act === 'school-logout') {
      const ok = await Modal.confirm({
        title: '🏫 Rời máy ở trường / Máy mượn?',
        message: 'Hệ thống sẽ đồng bộ toàn bộ từ vựng và kết quả học lên Cloud, sau đó XÓA SẠCH dữ liệu cá nhân trên trình duyệt này để bảo mật cho bạn khi rời máy.',
        confirmText: 'Lưu Cloud & Xóa sạch máy này',
        danger: true
      });
      if (!ok) return;
      Toast.show('☁️ Đang đồng bộ lần cuối lên Cloud...', 'info', 2000);
      try {
        await Cloud.sync({ silent: true });
      } catch (e) {
        console.warn(e);
      }
      S.items = [];
      S.stats = U.clone(DEFAULT_STATS);
      S.session = U.clone(DEFAULT_SESSION);
      S.settings = U.clone(DEFAULT_SETTINGS);
      S.tombstones = {};
      S.draft = null;
      S.bulkDraft = '';
      STORAGE_KEYS.forEach(k => StorageManager.remove(k));
      Store.saveSettings();
      Toast.show('✅ Đã lưu lên Cloud và xóa sạch tài khoản trên máy này! Bạn có thể yên tâm rời máy.', 'success', 4500);
      render();
    }
    else if (act === 'storage-badge-click') {
      if (Cloud.configured()) {
        Cloud.sync();
      } else {
        Cloud.showGuideModal('firebase');
      }
    }
    else if (act === 'wipe-all') {
      const ok = await Modal.confirm({
        title: '⚠️ Xóa toàn bộ dữ liệu?',
        message: 'Toàn bộ từ vựng, lịch sử học tập và bài kiểm tra trên trình duyệt này sẽ bị xóa sạch. Hãy chắc chắn bạn đã tải file Backup JSON trước!',
        confirmText: 'Xóa sạch dữ liệu',
        danger: true
      });
      if (!ok) return;
      S.items = [];
      S.stats = U.clone(DEFAULT_STATS);
      S.session = U.clone(DEFAULT_SESSION);
      S.tombstones = {};
      S.draft = null;
      S.bulkDraft = '';
      STORAGE_KEYS.forEach(k => StorageManager.remove(k));
      Store.saveSettings();
      Toast.show('🧹 Đã đặt lại toàn bộ dữ liệu về trạng thái ban đầu.', 'info');
      render();
    }
  });

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('[data-study-shuffle]')) {
      S.session.studyConfig.shuffle = t.checked;
      Store.saveSession();
    } else if (t.matches('[data-study-limit]')) {
      S.session.studyConfig.limit = Number(t.value);
      Store.saveSession();
    } else if (t.matches('[data-auto-speak]')) {
      S.settings.autoSpeak = t.checked;
      Store.saveSettings();
      if (t.checked) Study.speakWord();
    } else if (t.id === 'fileImport' && t.files && t.files[0]) {
      Backup.handleFile(t.files[0]);
    }
  });

  document.addEventListener('submit', e => {
    const f = e.target.closest('[data-test-form]');
    if (!f) return;
    e.preventDefault();
    const inp = f.querySelector('[data-test-input]');
    if (inp) { Test.checkAnswer(inp.value); lucide.createIcons(); }
  });

  /* Phím tắt bàn phím PC */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && Modal.isOpen()) {
      e.preventDefault();
      Modal.close();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      quickAdd();
      lucide.createIcons();
      return;
    }
    const tag = (e.target && e.target.tagName) || '';
    const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) || (e.target && e.target.isContentEditable);
    if (typing || Modal.isOpen()) return;

    if (e.key.toLowerCase() === 'n') {
      e.preventDefault();
      quickAdd();
      lucide.createIcons();
      return;
    }
    if (e.key === '?') {
      e.preventDefault();
      showShortcutsModal();
      return;
    }
    if (e.key === '/') {
      e.preventDefault();
      if (S.session.view !== 'library') go('library');
      setTimeout(() => { const s = document.getElementById('libSearch'); if (s) s.focus(); }, 50);
      return;
    }

    if (S.session.view === 'study' && Study.currentItem()) {
      const k = e.key.toLowerCase();
      if (e.code === 'Space') { e.preventDefault(); Study.flip(); }
      else if (k === 'h') { e.preventDefault(); Study.toggleHint(); }
      else if (k === 's') { e.preventDefault(); Study.speakWord(); }
      else if (k === 'e') { e.preventDefault(); Study.speakExample(0); }
      else if (['1', '2', '3', '4'].includes(k)) { e.preventDefault(); Study.grade(Number(k)); lucide.createIcons(); }
    } else if (S.session.view === 'test' && S.session.test && S.session.test.phase === 'running') {
      const q = Test.currentQ();
      if (!q) return;
      if (q.answered && e.key === 'Enter') { e.preventDefault(); Test.next(); lucide.createIcons(); return; }
      if (!q.answered && q.type === 'mc' && ['1', '2', '3', '4'].includes(e.key)) {
        const opt = q.options[Number(e.key) - 1];
        if (opt !== undefined) { e.preventDefault(); Test.checkAnswer(opt); lucide.createIcons(); }
      }
    }
  });

  window.addEventListener('beforeunload', () => Store.flushAll());
  window.addEventListener('pagehide', () => Store.flushAll());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      Store.flushAll();
    } else if (document.visibilityState === 'visible') {
      Cloud.triggerAutoPull();
    }
  });
  window.addEventListener('focus', () => {
    Cloud.triggerAutoPull();
  });
  window.addEventListener('online', () => {
    Toast.show('🌐 Đã kết nối mạng lại · Đang đồng bộ...', 'info', 2000);
    Cloud.triggerAutoPull(true);
  });
  /* Tự động kéo dữ liệu mới ngầm mỗi 3 phút nếu tab đang mở */
  setInterval(() => {
    if (document.visibilityState === 'visible' && navigator.onLine && Cloud.configured() && S.settings.cloud.autoSync) {
      Cloud.triggerAutoPull();
    }
  }, 180000);
}

/* ---------- Khởi tạo ứng dụng & Khôi phục trạng thái ---------- */
async function boot() {
  Speech.init();
  StorageManager.listeners.push(() => updateStorageUI(true));
  const loaded = await StorageManager.init();

  S.items = Array.isArray(loaded.vocab_items) ? loaded.vocab_items.map(sanitizeItem).filter(i => i.word && i.meaning) : [];
  S.stats = U.deepMerge(DEFAULT_STATS, loaded.study_stats || {});
  S.session = U.deepMerge(DEFAULT_SESSION, loaded.active_session || {});
  S.settings = U.deepMerge(DEFAULT_SETTINGS, loaded.app_settings || {});
  S.tombstones = U.isObj(loaded.tombstones) ? loaded.tombstones : {};
  S.draft = loaded.form_draft || null;
  S.bulkDraft = loaded.bulk_draft || '';

  /* Tự động kết nối Cloud nếu mở bằng đường link ghép nối 1 chạm (#sync=...) */
  let pairedViaHash = false;
  if (window.location.hash && window.location.hash.startsWith('#sync=')) {
    const raw = decodeURIComponent(window.location.hash.slice(6));
    if (Cloud.importSyncCode(raw)) {
      pairedViaHash = true;
      try {
        history.replaceState(null, document.title, window.location.pathname + window.location.search);
      } catch (e) { /* bỏ qua */ }
    }
  }

  /* Cập nhật ngày học mới và tính lại chuỗi ngày học (Streak) */
  const today = U.dateKey();
  if (!S.stats.todayWords || S.stats.todayWords.date !== today) {
    S.stats.todayWords = { date: today, ids: [] };
  }
  S.stats.streak = computeStreak();

  applyTheme(S.settings.theme);
  bindEvents();
  render();

  const savedTime = StorageManager.lastSavedAt ? U.time(StorageManager.lastSavedAt) : U.time();
  if (pairedViaHash) {
    Toast.show('🎉 Đã ghép nối thiết bị thành công! Đang tải dữ liệu từ Cloud...', 'success', 3500);
    Cloud.sync();
  } else {
    Toast.show(`✅ Đã tự động lưu (Cập nhật lúc ${savedTime} - Đang lưu trữ ${S.items.length} từ vựng)`, 'success', 3800);
    if (Cloud.configured() && S.settings.cloud.autoSync && navigator.onLine) {
      setTimeout(() => Cloud.sync({ silent: true }), 1200);
    }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
</body>
</html>
